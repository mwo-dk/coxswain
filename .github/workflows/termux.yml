name: Termux

# The terminal app as a Termux package: packaging/termux/coxswain/build.sh, built from this
# checkout with termux-packages' own builder for aarch64, then installed and started in a
# Termux image on an ARM runner. Nightly when master changed, and in every release; pull
# requests only when the Cargo files, the platform files it builds or the recipe change.
on:
  workflow_call: # from release.yml (a release or rehearsal; a master push touching the paths below) and nightly.yml
  pull_request:
    # Pull requests run this system only when its own packaging or workflow changes; every
    # other change is tested on it nightly and in every Release run (CLAUDE.md, Shipping).
    paths:
      - "packaging/termux/**"
      - ".github/workflows/termux.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: termux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # termux-packages, pinned; move it forward now and then.
  TERMUX_PACKAGES: decc2980bd7f3f2d1f1b51a5bb519c2f57bcfa70

jobs:
  build:
    name: Termux package (aarch64)
    # A release pull request's (release/X.Y.Z) run is its Release run, after the merge.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: coxswain

      - name: termux-packages
        run: |
          git init -q termux-packages
          git -C termux-packages fetch -q --depth 1 https://github.com/termux/termux-packages "$TERMUX_PACKAGES"
          git -C termux-packages checkout -q FETCH_HEAD

      # The recipe as it is submitted, but with this checkout as its source: a tarball inside
      # the builder's volume, which termux_download takes as a file:// URL.
      - name: Recipe, on this checkout
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' coxswain/Cargo.toml | head -1)
          git -C coxswain archive --prefix=coxswain/ -o "$PWD/termux-packages/coxswain-src.tar.gz" HEAD
          cp -r coxswain/packaging/termux/coxswain termux-packages/packages/coxswain
          sed -i -e "s|^TERMUX_PKG_VERSION=.*|TERMUX_PKG_VERSION=\"$version\"|" \
            -e "s|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=file:///home/builder/termux-packages/coxswain-src.tar.gz|" \
            -e "s|^TERMUX_PKG_SHA256=.*|TERMUX_PKG_SHA256=$(sha256sum termux-packages/coxswain-src.tar.gz | cut -d' ' -f1)|" \
            termux-packages/packages/coxswain/build.sh
          cat termux-packages/packages/coxswain/build.sh

      - name: Build
        working-directory: termux-packages
        # -I fetches the dependencies' packages from Termux's repository: tried again on a passing fault.
        run: ../coxswain/packaging/retry.sh ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 coxswain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coxswain-termux-aarch64
          path: termux-packages/output/coxswain*.deb
          if-no-files-found: error

  run:
    name: Termux package, installed and started
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coxswain-termux-aarch64
          path: debs
      - name: Install and start in Termux
        run: |
          chmod -R a+rX debs
          docker run --rm --privileged -v "$PWD/debs:/debs:ro" termux/termux-docker:aarch64 bash -c '
            set -e
            dpkg -i /debs/coxswain*.deb
            coxswain --version
            cox --version
            coxswain --paths
            coxswain --dump-config >/dev/null
            ls $PREFIX/share/man/man1/coxswain.1*'

  # The way `cargo install coxswain` builds it: in Termux itself (termux-docker on ARM64, as
  # on a phone), with the Termux parts of the core (its trash too) tested there.
  cargo:
    name: Built and tested in Termux
    # A release pull request's (release/X.Y.Z) run is its Release run, after the merge.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compiled dependencies (target/) and Cargo's downloads (target/cargo-home), kept
      # between runs: .github/actions/target-cache. Writable for the container's own user.
      - id: target
        uses: ./.github/actions/target-cache
        with:
          name: termux-aarch64-release
      - run: mkdir -p target && chmod -R a+rwX target
      - name: Build and test in Termux
        run: |
          docker run --rm -e COXSWAIN_SLOW_CI=1 -v "$PWD:/src:ro" -v "$PWD/target:/target" termux/termux-docker:aarch64 bash -c '
            set -e
            export CARGO_TARGET_DIR=/target CARGO_HOME=/target/cargo-home
            # A mirror answers an error now and then (429 Too Many Requests from one, for hours):
            # a later try is from the primary repository, with a fresh index.
            # The primary repository (a CDN) from the start: pkg picks a mirror at random, and one
            # served 220 MB at 41 kB/s (89 minutes, past the time limit of the job).
            echo "deb https://packages-cf.termux.dev/apt/termux-main stable main" > $PREFIX/etc/apt/sources.list
            rm -rf $PREFIX/etc/termux/chosen_mirrors
            apt-get update -q
            sh /src/packaging/pkg-retry.sh apt-get install -y rust clang binutils jq
            mkdir ~/src && tar -C /src --exclude=./target -cf - . | tar -C ~/src -xf - && cd ~/src
            # A stale mirror can serve an old rustc (1.92 once, when a locked crate needed 1.93).
            # The newest rust-version among the locked crates for Android is what it must reach;
            # short of it, rust comes from the primary repository, up to three times.
            need=$(cargo metadata --locked --format-version 1 --filter-platform aarch64-linux-android |
              jq -r ".packages[].rust_version // empty" | sort -V | tail -1)
            for i in 1 2 3 4; do
              have=$(rustc --version | cut -d" " -f2)
              [ "$(printf "%s\n%s\n" "$need" "$have" | sort -V | head -1)" = "$need" ] && break
              if [ "$i" = 4 ]; then
                echo "::error title=Termux rust::rustc $have from the Termux repository; the locked crates need $need"; exit 1
              fi
              echo "::warning::rustc $have is older than $need (try $i of 3): rust from packages.termux.dev"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" > $PREFIX/etc/apt/sources.list
              rm -rf $PREFIX/etc/termux/chosen_mirrors
              sleep $((20 * i))
              apt-get update -q || true
              apt-get install -y --only-upgrade rust || true
            done
            echo "rustc $have, the locked crates need ${need:-nothing in particular}"
            sh packaging/target-cache.sh check
            sh packaging/target-cache.sh retry cargo test --release --locked -p coxswain-core --lib --no-run
            cargo test --release --locked -p coxswain-core --lib -- termux update_ xdg_trash
            cargo build --release --locked -p coxswain
            /target/release/coxswain --version
            sh packaging/target-cache.sh prune release
            # What this run made in it, readable for the save on the runner (what was restored is
            # the runner user files, opened up before the run).
            find /target -mindepth 1 -user "$(id -u)" -exec chmod a+rwX {} +
          '
      - uses: ./.github/actions/target-cache
        with:
          name: termux-aarch64-release
          save: true
          matched: ${{ steps.target.outputs.matched-key }}
