<!--
	Draughts: black king, two discs stacked as on a real board.
	Drawn for Coxswain's author's games project and given to Coxswain under its MIT
	licence; restyled to sit beside the chess set: 45×45, black lines 1.5 wide, a soft
	shading.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 45 45">
	<defs><radialGradient id="g" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#000"/></radialGradient></defs>
	<circle cx="22.5" cy="17" r="15" fill="url(#g)" stroke="#000" stroke-width="1.5" opacity="0.9"/>
	<circle cx="22.5" cy="25" r="15" fill="url(#g)" stroke="#000" stroke-width="1.5"/>
	<circle cx="22.5" cy="25" r="10" fill="none" stroke="#FFF" stroke-width="1" opacity="0.45"/>
</svg>
