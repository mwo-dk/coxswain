# Temporary: proves .github/actions/apt-install's fallback on each runner image, with the
# first mirrors made unreachable. Removed before merge.
name: apt-install test
on:
  pull_request:
    paths: [".github/actions/apt-install/**", ".github/workflows/apt-install-test.yml"]
permissions:
  contents: read
jobs:
  fallback:
    name: fallback, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the first mirrors (they hang, like a stuck mirror)
        run: |
          for h in azure.archive.ubuntu.com archive.ubuntu.com ports.ubuntu.com; do echo "10.255.255.1 $h" | sudo tee -a /etc/hosts; done
          sudo apt-get clean
      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: musl-tools
      - run: musl-gcc --version || command -v musl-gcc
      - name: A release .deb, its dependencies from the fresh index
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" -p "Coxswain_*_$(dpkg --print-architecture).deb" -O coxswain.deb
      - if: startsWith(matrix.os, 'ubuntu-24.04')
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: xvfb
          debs: ./coxswain.deb
      - if: startsWith(matrix.os, 'ubuntu-24.04')
        run: dpkg-query -W coxswain xvfb && ldd /usr/bin/coxswain-gui | grep -c 'not found' | grep -qx 0
