name: Explore
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: explore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  netbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          release: "11.0"
          usesh: true
          prepare: |
            /usr/sbin/pkg_add pkgin || true
            pkgin -y install rust pkgconf webkit-gtk41 gtk3+ libsoup3 librsvg || true
            cat /var/db/pkgin/pkg_install-err.log || true
            ls /usr/X11R7/lib | head -5 || true
            for t in poppler-utils nerd-fonts-Symbols pandoc-cli tex-latexmk noto-cjk plantuml; do echo "## $t"; pkgin search "^$t" | head -4; done
          run: |
            set -e
            uname -a; rustc -V; ulimit -n; ulimit -Hn; sysctl kern.maxfiles
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 || true
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast || echo TESTS-FAILED
            cargo test -p coxswain-gui --locked || echo GUI-FAILED
            cargo build -p coxswain-gui --locked || true
            
            if [ -x target/debug/coxswain-gui ]; then
              Xvfb :99 -screen 0 1280x800x24 </dev/null >/dev/null 2>&1 &
              xpid=$!
              sleep 3
              mkdir -p /tmp/home && HOME=/tmp/home DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 target/debug/coxswain-gui "$PWD" </dev/null >gui.log 2>&1 &
              pid=$!
              sleep 40
              kill -0 $pid && echo GUI-RUNNING || echo GUI-DIED
              xwd -root -display :99 -silent > shot.xwd || true
              kill $pid || true
              sleep 2; pkill -U $(id -u) -f WebKit || true; kill $xpid || true
              cat gui.log | tail -40
            fi
            
            rm -rf target
      - name: Screenshot
        if: always()
        run: |
          ls -la shot* || true
          [ -f shot.xwd ] && convert xwd:shot.xwd shot.png || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shot-netbsd
          path: |
            shot.png
            gui.log
          if-no-files-found: ignore

  openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add -u
            pkg_add rust webkitgtk41 librsvg
            for t in tesseract poppler-utils libreoffice pandoc plantuml nerd-fonts texlive_base gstreamer1-plugins-good noto-cjk xdg-utils; do echo "## $t"; pkg_info -Q "$t" | head -4; done
          run: |
            set -e
            uname -a; rustc -V; ulimit -n; ulimit -Hn; ulimit -d; sysctl kern.maxfiles
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo build -p coxswain-gui --locked
            
            if [ -x target/debug/coxswain-gui ]; then
              Xvfb :99 -screen 0 1280x800x24 </dev/null >/dev/null 2>&1 &
              xpid=$!
              sleep 3
              mkdir -p /tmp/home && HOME=/tmp/home DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 target/debug/coxswain-gui "$PWD" </dev/null >gui.log 2>&1 &
              pid=$!
              sleep 40
              kill -0 $pid && echo GUI-RUNNING || echo GUI-DIED
              xwd -root -display :99 -silent > shot.xwd || true
              kill $pid || true
              sleep 2; pkill -U $(id -u) -f WebKit || true; kill $xpid || true
              cat gui.log | tail -40
            fi
            
            rm -rf target
      - name: Screenshot
        if: always()
        run: |
          ls -la shot* || true
          [ -f shot.xwd ] && convert xwd:shot.xwd shot.png || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shot-openbsd
          path: |
            shot.png
            gui.log
          if-no-files-found: ignore

  omnios:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        with:
          release: "r151058"
          usesh: true
          mem: 12288
          prepare: |
            pkg install build-essential ooce/developer/rust || true
            ls -la /usr/gnu/bin/diff || true
          run: |
            set -e
            export PATH=/opt/ooce/bin:$PATH
            uname -a; rustc -V
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast -j2 || echo TESTS-FAILED
            COXSWAIN_ZFS_E2E=1 cargo test -p coxswain-core --test zfs --locked -- --nocapture || echo ZFS-FAILED
            rm -rf target

  openindiana:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/openindiana-vm@f0ed27ca85a6d1f5b11e4242eba1d6effa5aaae2 # v1.1.8
        with:
          release: "202604"
          usesh: true
          prepare: |
            for t in webkit gtk3 libsoup rust rustc tesseract poppler libreoffice gstreamer noto; do echo "## $t"; pkg search -r -o pkg.name "*$t*" | sort -u | head -8; done
          run: |
            uname -a

  freebsd13:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "13.5"
          usesh: true
          run: |
            freebsd-version
            fetch -q https://github.com/mwo-dk/coxswain/releases/download/v2.1.2/coxswain-terminal-v2.1.2-x86_64-unknown-freebsd.tar.gz
            tar xzf coxswain-terminal-v2.1.2-x86_64-unknown-freebsd.tar.gz
            ./coxswain-terminal-v2.1.2-x86_64-unknown-freebsd/coxswain --version && echo FREEBSD13-RUNS || echo FREEBSD13-FAILS
            ./coxswain-terminal-v2.1.2-x86_64-unknown-freebsd/coxswain --help | head -5 || true
            rm -rf coxswain-terminal-*
