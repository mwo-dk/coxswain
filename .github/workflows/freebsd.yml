name: FreeBSD

# Both apps on FreeBSD, in a virtual machine: the core's and the terminal app's tests, and the
# desktop app built and its tests run. Every push to master;
# pull requests only for this system's code (paths below).
on:
  workflow_call: # from release.yml, for every push to master
  pull_request:
    # Pull requests run the machine only for code with branches for this system;
    # every push to master runs it as part of the Release run (CLAUDE.md, Shipping).
    paths:
      - "crates/coxswain-core/src/lib.rs"
      - "crates/coxswain-core/src/machine.rs"
      - "crates/coxswain-core/src/kq.rs"
      - "crates/coxswain-core/src/ports.rs"
      - "crates/coxswain-core/src/bsd.rs"
      - "crates/coxswain-core/src/zfs.rs"
      - "crates/coxswain-core/src/flags.rs"
      - "crates/coxswain-core/src/service.rs"
      - "crates/coxswain-core/src/fs.rs"
      - "crates/coxswain-core/src/index.rs"
      - "crates/coxswain-core/src/tools.rs"
      - "crates/coxswain-core/src/update.rs"
      - "crates/coxswain-core/src/cloud.rs"
      - "crates/coxswain-core/src/setup.rs"
      - "crates/coxswain-core/src/menu.rs"
      - "crates/coxswain-core/tests/zfs.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "gui/src-tauri/src/main.rs"
      - "install/**"
      - "packaging/freebsd/**"
      - ".github/workflows/freebsd.yml"
  # The port, built and checked by hand on each supported release (packaging/freebsd/README.md).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the port builds, e.g. v2.8.1
        required: true

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: freebsd-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || github.workflow != 'FreeBSD'
    name: FreeBSD ${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The desktop app embeds gui/dist; the frontend builds here, not in the VM.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules

      # Cargo's downloads, kept between runs: the VM's CARGO_HOME is inside the checkout, and
      # copied back from the VM after the run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-freebsd
          key: freebsd-${{ matrix.release }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: freebsd-${{ matrix.release }}-cargo-

      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y rust pkgconf webkit2-gtk_41 gtk3 libsoup3 librsvg2-rust
          run: |
            set -e
            export CARGO_HOME="$PWD/.cargo-freebsd"
            freebsd-version
            rustc -V
            cargo test -p coxswain-core -p coxswain -p coxswain-gui --locked
            # ZFS from end to end on a pool in a file: snapshots as folders, the diff, a copy
            # restored, the refusals, file flags. The VM runs as root.
            kldload zfs 2>/dev/null || true
            COXSWAIN_ZFS_E2E=1 cargo test -p coxswain-core --test zfs --locked
            # Only the cache goes back to the runner, not the build.
            rm -rf target

  port:
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'FreeBSD'
    name: Port on FreeBSD ${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          TAG: ${{ inputs.tag }}
        with:
          release: ${{ matrix.release }}
          usesh: true
          envs: TAG
          prepare: pkg install -y git rust oniguruma portlint
          run: |
            set -e
            freebsd-version
            sh packaging/freebsd/update-port.sh "$TAG"
            # update-port.sh cleans up after its package: install the port to try it.
            make -C /usr/ports/sysutils/coxswain install clean BATCH=yes
            coxswain --version
            man -w coxswain
