name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # The Tauri crate embeds gui/dist at compile time, so the frontend builds first.
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check
          npm test
          npm run build

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked

      # The terminal app ships as a static musl binary (Homebrew, releases): whatever the
      # dependencies compile from C has to build for musl too, before a release finds out.
      - name: Terminal app, static musl build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build -p coxswain --target x86_64-unknown-linux-musl --locked
