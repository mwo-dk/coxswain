[package]
name = "coxswain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Coxswain: a Norton Commander style file manager for the terminal"

# The program is the library, so it is built and tested once; the two names call it.
[lib]
doctest = false

[[bin]]
name = "coxswain"
path = "src/bin/coxswain.rs"
test = false

# The same program under a name that is quick to type.
[[bin]]
name = "cox"
path = "src/bin/cox.rs"
test = false

[dependencies]
coxswain-core.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
unicode-normalization = "0.1.25"
serde_json = "1"
base64 = "0.23"
# The built-in viewer's highlighting: Sublime Text grammars, with fancy-regex (pure Rust, no
# Oniguruma to compile), and two-face's grammars beyond syntect's own (bat's, ~200 languages).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# The chess pieces drawn as pictures where the terminal shows them (`pictures`): the SVGs
# rendered in pure Rust, no fonts, text or raster images.
resvg = { version = "0.48", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows Terminal's answer about pictures, read through the console's input (`pictures`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

# Tests get a home of their own in the temporary folder (`coxswain_core::dirs`).
[dev-dependencies]
coxswain-core = { workspace = true, features = ["test-home"] }
