	<defs><radialGradient id="g" cx="0.35" cy="0.32" r="0.75"><stop offset="0" stop-color="#6b6b6f"/><stop offset="0.35" stop-color="#2e2e31"/><stop offset="1" stop-color="#0b0b0d"/></radialGradient></defs>
	<circle cx="22.5" cy="22.5" r="20.7" fill="url(#g)"/>
</svg>
