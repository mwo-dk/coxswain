[workspace]
resolver = "3"
members = ["crates/coxswain-core", "crates/coxswain", "gui/src-tauri"]

[workspace.package]
version = "2.34.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mwo-dk/coxswain"
homepage = "https://github.com/mwo-dk/coxswain"
readme = "README.md"
keywords = ["file-manager", "norton-commander", "tui", "search", "git"]
categories = ["command-line-utilities", "filesystem"]

# `version` is the workspace version, exactly (bumped with it): crates.io needs one, and
# `cargo install coxswain --version X` then builds X's own library, not the newest 2.x.
[workspace.dependencies]
coxswain-core = { path = "crates/coxswain-core", version = "=2.34.0" }

[profile.release]
lto = "thin"
codegen-units = 1
# The symbol table goes too (rustc already drops the debug info): 11 to 13 % smaller programs.
# A panic still says what and where; only a RUST_BACKTRACE backtrace loses its function names.
# panic = "abort" is out: catch_unwind keeps a bad file from ending the app (pictures, extract,
# archive). lto = "fat" would take off 7 % more, at more memory in the release VMs.
strip = true

# gemm's f16 kernels on ARM64 (candle) are inline assembly that needs the CPU's fp16, which
# only the functions that ask for it have. Unoptimised, they are compiled on their own,
# without it, and the assembler refuses them (Rust 1.99); optimised, they are inlined.
[profile.dev.package.gemm-f16]
opt-level = 3

# FreeBSD (and the other BSDs) for the desktop app, until this fix is released upstream: tao's
# hit testing on BSD (tauri-apps/tao#1356, merged after 0.37.1). It only widens
# `cfg(target_os = "linux")` to the BSDs, so Linux, macOS and Windows build the same code as from
# crates.io. docs/systems/freebsd.md.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "d19f4c12a0d881260a436d9ccf3e8f349c58e2a4" }
# The same source as crates.io's 0.1.4, so wry and tao share one copy: Nix vendors a crate by name and
# version, and two tao-macros 0.1.4 would collide there (packaging/nix).
tao-macros = { git = "https://github.com/tauri-apps/tao", rev = "d19f4c12a0d881260a436d9ccf3e8f349c58e2a4" }
# candle-core 0.11.0 needs zip 8, which has three advisories (RUSTSEC-2026-0367, -0368, -0369) and
# no fixed 8.x. vendor/candle-core is 0.11.0 on zip 9: its zip requirement and three lines that read
# names (names are a Result in zip 9; src/npy.rs, src/pickle.rs). Drop this when candle moves to zip 9.
candle-core = { path = "vendor/candle-core" }
