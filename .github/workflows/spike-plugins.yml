# Plugin spike (#1024): on the spike/plugins branch only, never on master.
name: Plugin spike
on:
  push:
    branches: [spike/plugins]
    paths: [spike/**, '!spike/frame-app/**', .github/workflows/spike-plugins.yml]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  runtime:
    name: runtime ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ runner.os == 'Linux' && runner.arch == 'X64' && 'x86_64-unknown-linux-musl' || '' }}
      - name: Test data (lichess 2013-01, CC0)
        run: |
          python3 -m pip install --quiet zstandard || python3 -m pip install --quiet --break-system-packages zstandard
          curl -sSfL -o lichess.pgn.zst https://database.lichess.org/standard/lichess_db_standard_rated_2013-01.pgn.zst
          python3 bench/data.py lichess.pgn.zst data
      - name: Musl tools
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get install -y musl-tools
      - name: Sizes
        run: bash bench/sizes.sh | tee sizes.txt
      - name: Benchmarks
        run: bash bench/run.sh data | tee bench.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.os }}
          path: |
            spike/sizes.txt
            spike/bench.txt
