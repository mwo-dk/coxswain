name: OpenBSD

# Both apps on OpenBSD, in a virtual machine, with OpenBSD's own Rust (OpenBSD is a tier 3 Rust
# target: no rustup). The tests of the core, the terminal app and the desktop app; the desktop
# app started under X11 for a minute, with a picture of its window as this run's artifact; the
# terminal app's archive packed as a release packs it, installed with install/install-unix.sh,
# and the search helper's rc.d script started with rcctl, checked and stopped.
# Nightly when master changed, and in every release; pull requests only for this system's code (paths below). docs/systems/openbsd.md.
# The port for openbsd-wip (packaging/openbsd/port) builds a crates.io release, not this
# checkout, so it runs only when started by hand: `gh workflow run openbsd.yml` (--ref <branch>).
on:
  workflow_dispatch:
  workflow_call: # from release.yml (a release or rehearsal; a master push touching the paths below) and nightly.yml
  pull_request:
    # Pull requests run this system only when its own packaging or workflow changes; every
    # other change is tested on it nightly and in every Release run (CLAUDE.md, Shipping).
    paths:
      - "packaging/openbsd/**"
      - ".github/workflows/openbsd.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: openbsd-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenBSD 7.9
    if: ${{ (github.event_name != 'workflow_dispatch' || github.workflow != 'OpenBSD') && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The desktop app embeds gui/dist; the frontend builds here, not in the VM.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-vm
          key: openbsd-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: openbsd-cargo-
      # The compiled dependencies (target/), kept between runs: .github/actions/target-cache.
      - id: target
        uses: ./.github/actions/target-cache
        with:
          name: openbsd-7.9-debug

      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: qemu-utils qemu-system-x86 ovmf # what each pinned vmactions action's install() asks for on x86_64
          recommends: false
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          disable-cache: "true" # no VM image cache: the 10 GB go to compiled dependencies (.github/actions/target-cache)
          release: "7.9"
          usesh: true
          custom-shell-name: vmsh
          prepare: |
            sh packaging/pkg-retry.sh pkg_add -u
            sh packaging/pkg-retry.sh pkg_add rust webkitgtk41 librsvg symbolsonly-nerd-fonts
          run: |
            set -e
            export CARGO_HOME="$PWD/.cargo-vm" CARGO_PROFILE_DEV_DEBUG=line-tables-only COXSWAIN_SLOW_CI=1
            uname -a
            rustc -V
            sh packaging/target-cache.sh check
            sh packaging/target-cache.sh retry cargo test -p coxswain-core -p coxswain -p coxswain-gui --locked --no-run
            cargo test -p coxswain-core -p coxswain -p coxswain-gui --locked
            cargo build -p coxswain -p coxswain-gui --locked
            mkdir -p out && cp target/debug/coxswain target/debug/coxswain-gui out/
            # Back to the runner: the cache, the programs and target/'s dependencies.
            sh packaging/target-cache.sh prune debug
      - uses: ./.github/actions/target-cache
        with:
          name: openbsd-7.9-debug
          save: true
          matched: ${{ steps.target.outputs.matched-key }}

      - name: The desktop app starts and draws its window
        shell: vmsh {0}
        run: |
          set -e
          Xvfb :99 -screen 0 1280x800x24 </dev/null >/dev/null 2>&1 &
          xpid=$!
          sleep 3
          mkdir -p /tmp/home
          HOME=/tmp/home DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 out/coxswain-gui "$PWD" </dev/null >gui.log 2>&1 &
          pid=$!
          sleep 60
          xwd -root -display :99 -silent > gui.xwd
          alive=0; kill -0 $pid && alive=1
          kill $pid || true
          sleep 2
          pkill -f WebKit || true
          kill $xpid || true
          tail -20 gui.log
          [ "$alive" = 1 ] || { echo "The desktop app did not stay up" >&2; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbsd-desktop
          path: |
            gui.xwd
            gui.log
          if-no-files-found: ignore

      - name: Pack the archive as a release does
        run: sh packaging/pack-unix.sh v0.0.0 x86_64-unknown-openbsd out dist packaging/openbsd/coxswain_index

      - name: Install it as a user does, and the search helper from boot
        shell: vmsh {0}
        run: |
          set -e
          sh install/install-unix.sh --from dist --yes --terminal-only --prefix /usr/local
          /usr/local/bin/coxswain --version
          /usr/local/bin/cox --version
          man -w coxswain
          useradd -m alice
          if rcctl -f start coxswain_index; then echo "started without a user" >&2; exit 1; fi
          rcctl enable coxswain_index
          rcctl set coxswain_index user alice
          rcctl start coxswain_index
          sleep 8
          rcctl check coxswain_index
          test -s /home/alice/.cache/coxswain/index.addr
          rcctl stop coxswain_index
          sleep 3
          if pgrep -U alice coxswain; then echo "still running" >&2; exit 1; fi
          sh install/install-unix.sh --uninstall --yes --prefix /usr/local
          test ! -e /usr/local/bin/coxswain && test ! -e /etc/rc.d/coxswain_index

  # The port as openbsd-wip and ports@ get it, built with the 7.9 ports tree: the checksums and
  # the crate list made again and compared, `make package`, the library check, the packing list,
  # then the package installed with pkg_add and tried. What the tree makes is this run's artifact.
  port:
    name: OpenBSD 7.9, the port for openbsd-wip
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'OpenBSD'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: qemu-utils qemu-system-x86 ovmf # what each pinned vmactions action's install() asks for on x86_64
          recommends: false
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          disable-cache: "true" # no VM image cache: the 10 GB go to compiled dependencies (.github/actions/target-cache)
          release: "7.9"
          usesh: true
          custom-shell-name: vmsh
          prepare: |
            sh packaging/pkg-retry.sh pkg_add -u
            sh packaging/pkg-retry.sh pkg_add rust cargo-generate-vendor oniguruma sqlite3
          run: |
            set -e
            ftp -o /tmp/ports.tar.gz https://cdn.openbsd.org/pub/OpenBSD/7.9/ports.tar.gz
            tar -C /usr -xzf /tmp/ports.tar.gz
            mkdir -p /usr/ports/openbsd-wip/sysutils
            cp -R packaging/openbsd/port/sysutils/coxswain /usr/ports/openbsd-wip/sysutils/
            echo 'PORTSDIR_PATH=${PORTSDIR}:${PORTSDIR}/openbsd-wip' >> /etc/mk.conf

      - name: Checksums and crate list, made again
        shell: vmsh {0}
        run: |
          set -e
          mkdir -p out
          cd /usr/ports/openbsd-wip/sysutils/coxswain
          make makesum
          cp distinfo "$OLDPWD/out/"
          make modcargo-gen-crates | grep '^MODCARGO_CRATES' > "$OLDPWD/out/gen-crates"
          make modcargo-gen-crates-licenses | grep '^MODCARGO_CRATES' > "$OLDPWD/out/crates.inc"
          cd "$OLDPWD"
          p=packaging/openbsd/port/sysutils/coxswain
          diff -u $p/distinfo out/distinfo
          sed 's/[[:space:]]*#.*//' $p/crates.inc | diff -u - out/gen-crates
          diff -u $p/crates.inc out/crates.inc

      - name: make package, the library check and the packing list
        shell: vmsh {0}
        run: |
          set -e
          cd /usr/ports/openbsd-wip/sysutils/coxswain
          make package
          make port-lib-depends-check 2>&1 | tee "$OLDPWD/out/lib-depends"
          ! grep -E 'Missing|Extra|Bogus' "$OLDPWD/out/lib-depends"
          cp pkg/PLIST /tmp/PLIST
          make update-plist
          cp pkg/PLIST "$OLDPWD/out/PLIST"
          diff -u /tmp/PLIST pkg/PLIST
          /usr/ports/infrastructure/bin/portcheck | tee "$OLDPWD/out/portcheck" || true
          make test 2>&1 | tail -40 > "$OLDPWD/out/test.log" || echo "make test failed: out/test.log"

      - name: Installed with pkg_add, and tried
        shell: vmsh {0}
        run: |
          set -e
          pkg_add -D unsigned /usr/ports/packages/amd64/all/coxswain-*.tgz
          pkg_info -L coxswain
          coxswain --version
          cox --version
          man -w coxswain
          useradd -m alice
          rcctl enable coxswain_index
          rcctl set coxswain_index user alice
          rcctl start coxswain_index
          sleep 8
          rcctl check coxswain_index
          rcctl stop coxswain_index
          rcctl disable coxswain_index
          pkg_delete coxswain
          test ! -e /usr/local/bin/coxswain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbsd-port
          path: out/
          if-no-files-found: ignore
