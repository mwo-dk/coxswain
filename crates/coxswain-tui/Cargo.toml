[package]
name = "coxswain-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coxswain: a Norton Commander style file manager for the terminal"

[[bin]]
name = "coxswain"
path = "src/main.rs"

[dependencies]
coxswain-core = { path = "../coxswain-core" }
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
