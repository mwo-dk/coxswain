name: Release

# Hands-off: when CI passes on master and the version in Cargo.toml has no release yet, build
# every platform, publish the GitHub Release (which creates the tag) and update the AUR,
# crates.io, Homebrew, Scoop and winget.
# To release, bump `version` in Cargo.toml. Nothing else.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: # retry by hand if a runner hiccupped

permissions:
  contents: write

# One release run at a time. Two overlapping runs for the same version would each treat the
# other's draft as a leftover and delete it mid-upload. Later runs wait instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: create
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$state" = false ]; then
            echo "$TAG is already released; nothing to do."
            exit 0
          fi
          # A draft left by a failed run is replaced, so a retry starts clean.
          [ "$state" = true ] && gh release delete "$TAG" --yes
          gh release create "$TAG" --draft --target "$SHA" --title "Coxswain $TAG" --notes-file .github/release-notes.md
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: draft
    if: needs.draft.outputs.id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest glibc still supported, so the AppImage runs on more distros
            args: ""
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: gui
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

  terminal:
    needs: draft
    if: needs.draft.outputs.id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static musl binaries on Linux run on any distribution.
      - run: cargo build --release --locked -p coxswain --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="coxswain-terminal-$TAG-$TARGET"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/$TARGET/release/coxswain.exe "$name/"
            7z a -bso0 "$name.zip" "$name"
            file="$name.zip"
          else
            cp target/$TARGET/release/coxswain "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          gh release upload "$TAG" "$file" "$file.sha256"

  publish:
    needs: [draft, desktop, terminal]
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.draft.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest

  aur:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [coxswain, coxswain-bin]
    env:
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so the AUR is not updated. See packaging/aur/README.md."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Set pkgver
        if: env.HAS_KEY == 'true'
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/${{ matrix.pkg }}/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: env.HAS_KEY == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          commit_username: Michael W. Olesen
          commit_email: michael.w.olesen@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.draft.outputs.tag }}

  crates:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set, so crates.io is not updated. See packaging/README.md."
      - uses: actions/checkout@v7
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.CARGO_REGISTRY_TOKEN != ''
      # Core first: the terminal app depends on it. Cargo waits until it is in the index.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish --locked -p coxswain-core
          cargo publish --locked -p coxswain

  taps:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set, so Homebrew and Scoop are not updated. See packaging/README.md."
      - uses: actions/checkout@v7
        if: env.TAP_TOKEN != ''
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Update mwo-dk/homebrew-coxswain and mwo-dk/scoop-coxswain
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          git config --global user.name "Michael W. Olesen"
          git config --global user.email michael.w.olesen@gmail.com
          for repo in homebrew-coxswain scoop-coxswain; do
            git clone -q "https://x-access-token:$TAP_TOKEN@github.com/mwo-dk/$repo.git"
          done
          packaging/taps/generate.sh "$TAG" homebrew-coxswain scoop-coxswain
          for repo in homebrew-coxswain scoop-coxswain; do
            git -C "$repo" add -A
            # Only "no changes" is fine; a failed push must fail the job.
            if git -C "$repo" diff --cached --quiet; then
              echo "$repo: already up to date"
            else
              git -C "$repo" commit -qm "Coxswain ${TAG#v}"
              git -C "$repo" push -q
            fi
          done

  # Only updates: the first version of each package is submitted by hand (packaging/README.md).
  winget:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set, so winget is not updated. See packaging/README.md."
      - uses: actions/checkout@v7
        if: env.WINGET_TOKEN != ''
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Open winget-pkgs pull requests
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          gh release download --repo russellbanks/Komac --pattern 'komac-*-x86_64-unknown-linux-gnu.tar.gz' --output komac.tar.gz
          tar xzf komac.tar.gz
          v="${TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          notes="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          ./komac update mwo-dk.Coxswain --version "$v" --urls "$base/Coxswain_${v}_x64_en-US.msi" \
            --release-notes-url "$notes" --submit --token "$WINGET_TOKEN"
          # The terminal zip's exe path carries the version, so its manifests are written, not updated.
          packaging/winget/terminal.sh "$TAG" winget-terminal
          ./komac submit --yes --token "$WINGET_TOKEN" winget-terminal/manifests/m/mwo-dk/Coxswain/Terminal/"$v"
