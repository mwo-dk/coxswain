# cargo-about: the Rust half of THIRD-PARTY-NOTICES.md (tools/bom/README.md).
# `accepted` is deny.toml's allow list; cargo deny is what enforces it.
accepted = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "0BSD", "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "Unicode-3.0", "MPL-2.0",
  "CDLA-Permissive-2.0", "bzip2-1.0.6",
]
# Every platform a release ships for.
targets = [
  "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# ring's licence file holds several licences in one; cargo-about knows how to read it.
workarounds = ["ring"]
