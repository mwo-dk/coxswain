<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Coxswain's icon, in the Cyber theme's colours: two panes on a CRT, a selected row. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07180d"/>
      <stop offset="1" stop-color="#020805"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#33ff66" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="190" fill="url(#screen)" stroke="#0d3f1f" stroke-width="12"/>
  <rect x="64" y="64" width="896" height="896" rx="190" fill="url(#scan)"/>
  <g filter="url(#glow)">
    <rect x="172" y="216" width="300" height="592" rx="30" fill="none" stroke="#33ff66" stroke-width="40"/>
    <rect x="552" y="216" width="300" height="592" rx="30" fill="none" stroke="#33ff66" stroke-width="40"/>
    <!-- Left pane: a folder, the selected row, a file. -->
    <rect x="228" y="300" width="160" height="48" rx="10" fill="#5cf2ff"/>
    <rect x="210" y="400" width="224" height="76" rx="12" fill="#33ff66"/>
    <rect x="228" y="528" width="180" height="48" rx="10" fill="#1c9c48"/>
    <rect x="228" y="628" width="130" height="48" rx="10" fill="#1c9c48"/>
    <!-- Right pane: a folder and files. -->
    <rect x="608" y="300" width="196" height="48" rx="10" fill="#5cf2ff"/>
    <rect x="608" y="400" width="140" height="48" rx="10" fill="#1c9c48"/>
    <rect x="608" y="500" width="180" height="48" rx="10" fill="#1c9c48"/>
    <rect x="608" y="600" width="110" height="48" rx="10" fill="#1c9c48"/>
  </g>
</svg>
