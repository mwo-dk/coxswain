[package]
name = "bosum-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Bosum: a Norton Commander style file manager, desktop edition"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bosum-core.workspace = true
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
dirs = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
drag = "2.1.1"
notify = "8"
