name: WinGet

# Once a week, the newest release goes to WinGet: one pull request to microsoft/winget-pkgs for
# mwo-dk.Coxswain and one for mwo-dk.Coxswain.Terminal, by Komac (pinned, checked by its SHA-256).
# Not one per release: WinGet's moderators review every pull request by hand, and several a day
# stalled them. Our older pull requests still open for a package are closed as superseded by the
# newest one, so a package never has more than one open. release-check.yml holds the lag to a week.
#
# The first version of each package is submitted by hand. Until Microsoft has listed it, its open
# New-Package pull request is moved to the newest release in place (that version's manifests
# instead of the old one's, and the title), so it keeps its place in the moderators' queue; with
# no such pull request the run says so and skips the package. A version that has its pull request
# (open or merged) is not filed again. Needs WINGET_TOKEN: a classic token with public_repo, from the account whose
# fork of winget-pkgs the pull requests come from (packaging/README.md).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch: # by hand: files the newest release now, if it has no pull request yet

permissions:
  contents: read

concurrency:
  group: winget
  cancel-in-progress: false

jobs:
  winget:
    if: github.repository == 'mwo-dk/coxswain'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set, so WinGet is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WINGET_TOKEN != ''
        with:
          persist-credentials: false
      - name: File winget-pkgs pull requests, close the ones they supersede
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          TAG=$(gh release view -R "$REPO" --json tagName -q .tagName)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          packaging/retry.sh curl -fsSL -o komac.tar.gz https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz
          echo "7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d  komac.tar.gz" | sha256sum -c -
          tar xzf komac.tar.gz komac
          v="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"
          notes="https://github.com/$REPO/releases/tag/$TAG"
          me=$(GH_TOKEN="$WINGET_TOKEN" gh api user -q .login)
          # The number of our open or merged pull request for $id $v, from winget-pkgs' search. Only
          # ours: anyone can open one with the same title.
          pr_of() {
            gh pr list -R microsoft/winget-pkgs --state all --author "$me" --search "$1 version $2 in:title" --json number,title,state \
              -q '.[] | select(.state != "CLOSED") | "\(.number)\t\(.title)"' |
              awk -F '\t' -v t="$1 version $2" '$2 ~ /^(New|Add|Update) version: / && substr($2, index($2, ": ") + 2) == t { print $1; exit }'
          }
          # Not on WinGet yet: our open New-Package pull request for $id moves to $v in place. Its
          # manifests are the old version's with the version, the installers' SHA-256 and the
          # release date changed (komac 2.16's `new` asks on a terminal even with --dry-run, and
          # `update` needs a listed package). A New-Package pull request holds one version.
          update_new() {
            id="$1"; shift
            pr=$(gh pr list -R microsoft/winget-pkgs --state open --author "$me" --search "$id version in:title" --limit 100 \
              --json number,title,headRefName,headRepositoryOwner -q '.[] | "\(.number)\t\(.title)\t\(.headRefName)\t\(.headRepositoryOwner.login)"') || return 1
            n="" old="" branch="" owner=""
            while IFS=$'\t' read -r num title ref own; do
              [[ "$title" =~ ^New\ package:\ (.+)\ version\ ([0-9][^ ]*)$ ]] && [ "${BASH_REMATCH[1]}" = "$id" ] || continue
              n="$num" old="${BASH_REMATCH[2]}" branch="$ref" owner="$own"; break
            done <<<"$pr"
            if [ -z "$n" ]; then
              echo "::notice::$id is not on WinGet yet and has no open New-Package pull request of ours; its first version is filed by hand."; return 0
            fi
            [ "$owner" = "$me" ] || { echo "::error::microsoft/winget-pkgs#$n comes from $owner, not $me"; return 1; }
            if [ "$old" = "$v" ]; then echo "$id $v has its pull request already: microsoft/winget-pkgs#$n"; return 0; fi
            if [ "$(printf '%s\n' "$old" "$v" | sort -V | tail -1)" != "$v" ]; then
              echo "::notice::microsoft/winget-pkgs#$n holds $id $old, newer than $v: left as it is"; return 0
            fi
            first=$(printf %s "${id:0:1}" | tr '[:upper:]' '[:lower:]')
            dir="manifests/$first/${id//.//}"
            rm -rf fork
            packaging/retry.sh git clone -q --depth 1 --filter=blob:none --sparse --branch "$branch" "https://github.com/$owner/winget-pkgs.git" fork || return 1
            git -C fork sparse-checkout set "$dir" || return 1
            # Version folders on the branch: the old one, or the new one when a run pushed it and
            # then failed to retitle the pull request.
            have=$(find "fork/$dir" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -printf '%f\n')
            if [ "$have" = "$old" ]; then
              mkdir "fork/$dir/$v"
              for f in "fork/$dir/$old"/*.yaml; do
                # Komac writes CRLF; edited as LF (winget-pkgs' .gitattributes stores YAML as LF).
                sed -e 's/\r$//' -e "s/${old//./\\.}/$v/g" "$f" > "fork/$dir/$v/${f##*/}"
              done
              inst="fork/$dir/$v/$id.installer.yaml"
              [ "$(grep -c '^  InstallerUrl: ' "$inst")" = "$#" ] || { echo "::error::$inst has not one installer for each of: $*"; return 1; }
              for url in "$@"; do
                grep -qxF "  InstallerUrl: $url" "$inst" || { echo "::error::$inst has no installer $url"; return 1; }
                rm -f installer.bin
                packaging/retry.sh curl -fsSL -o installer.bin "$url" || return 1
                sha=$(sha256sum installer.bin | cut -d ' ' -f 1 | tr a-f A-F)
                awk -v u="  InstallerUrl: $url" -v s="$sha" '$0 == u { hit = 1; print; next }
                  hit && /^  InstallerSha256: / { $0 = "  InstallerSha256: " s; hit = 0 } { print }' "$inst" > "$inst.new" && mv "$inst.new" "$inst"
                grep -qx "  InstallerSha256: $sha" "$inst" || { echo "::error::no SHA-256 written for $url"; return 1; }
              done
              day=$(gh release view "$TAG" -R "$REPO" --json publishedAt -q .publishedAt | cut -c 1-10) || return 1
              sed -i "s/^ReleaseDate: .*/ReleaseDate: $day/" "$inst"
              git -C fork rm -rq "$dir/$old" && git -C fork add "$dir/$v" || return 1
              git -C fork -c user.name="$me" -c user.email="$me@users.noreply.github.com" commit -qm "New package: $id version $v" || return 1
              git -C fork show --stat HEAD
              # The token reaches git through a credential helper, never in a URL or the log.
              # shellcheck disable=SC2016 # $WINGET_TOKEN is expanded by the helper, not here
              packaging/retry.sh git -C fork -c credential.helper= \
                -c credential.helper='!f() { echo username=x-access-token; echo "password=$WINGET_TOKEN"; }; f' \
                push -q "https://github.com/$owner/winget-pkgs.git" "HEAD:refs/heads/$branch" || return 1
            elif [ "$have" != "$v" ]; then
              echo "::error::$branch holds ${have//$'\n'/ } under $dir, not $old alone"; return 1
            fi
            GH_TOKEN="$WINGET_TOKEN" packaging/retry.sh gh pr edit "$n" -R microsoft/winget-pkgs --title "New package: $id version $v" || return 1
            echo "$id $v: microsoft/winget-pkgs#$n, moved from $old in place"
          }
          update() {
            id="$1"; shift
            rm -f komac.log
            # Listed: winget-pkgs has a manifest folder for one of its versions.
            listed=0; packaging/winget-listed.sh "$id" || listed=$?
            case $listed in
              1) update_new "$id" "$@"; return ;;
              2) return 1 ;;
            esac
            has=0; packaging/winget-listed.sh "$id" "$v" "$me" || has=$?
            case $has in
              0) echo "$id $v has its pull request already" ;;
              1) packaging/retry.sh ./komac update "$id" --version "$v" --urls "$@" --release-notes-url "$notes" --submit --token "$WINGET_TOKEN" | tee komac.log || return 1 ;;
              *) return 1 ;;
            esac
            # The new pull request's number: from Komac's output, or from the search once it has it.
            n=$(grep -oE 'github\.com/microsoft/winget-pkgs/pull/[0-9]+' komac.log 2>/dev/null | head -1 | sed 's,.*/,,') || true
            for _ in $(seq 20); do
              [ -n "$n" ] && break
              n=$(pr_of "$id" "$v"); [ -n "$n" ] || sleep 30
            done
            [ -n "$n" ] || { echo "::error::no pull request found for $id $v"; return 1; }
            echo "$id $v: microsoft/winget-pkgs#$n"
            # Ours, still open, for an older version of this package: superseded.
            gh pr list -R microsoft/winget-pkgs --state open --author "$me" --search "$id version in:title" --limit 100 \
              --json number,title -q '.[] | "\(.number)\t\(.title)"' |
            while IFS=$'\t' read -r num title; do
              [[ "$title" =~ ^(New|Add|Update)\ version:\ (.+)\ version\ ([0-9][^ ]*)$ ]] || continue
              [ "${BASH_REMATCH[2]}" = "$id" ] && [ "$num" != "$n" ] || continue
              old="${BASH_REMATCH[3]}"
              [ "$old" != "$v" ] && [ "$(printf '%s\n' "$old" "$v" | sort -V | head -1)" = "$old" ] || continue
              echo "Closing microsoft/winget-pkgs#$num ($id $old), superseded by #$n"
              GH_TOKEN="$WINGET_TOKEN" packaging/retry.sh gh pr close "$num" -R microsoft/winget-pkgs --comment "Superseded by #$n ($id $v)." || exit 1
            done || return 1
          }
          # Komac takes each installer's architecture from the file: x64 and Windows on ARM.
          bad=0
          update mwo-dk.Coxswain "$base/Coxswain_${v}_x64-setup.exe" "$base/Coxswain_${v}_arm64-setup.exe" || bad=1
          update mwo-dk.Coxswain.Terminal "$base/coxswain-terminal-$TAG-x86_64-pc-windows-msvc.zip" "$base/coxswain-terminal-$TAG-aarch64-pc-windows-msvc.zip" || bad=1
          exit $bad
      - if: failure()
        run: echo "::error title=Channel failed::WinGet, ${TAG:-the newest release}"
