name: Release

# Hands-off: when CI passes on master and the version in Cargo.toml has no release yet, build
# every platform, publish the GitHub Release (which creates the tag) and update the AUR,
# crates.io and Homebrew.
# To release, bump `version` in Cargo.toml. Nothing else.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: # retry by hand if a runner hiccupped

# Read only, but for the jobs that make the release.
permissions:
  contents: read

# One release run at a time. Two overlapping runs for the same version would each treat the
# other's draft as a leftover and delete it mid-upload. Later runs wait instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    # `branches: [master]` above matches a fork's branch named master too: only a push to this
    # repository's master releases, and a retry by hand only from master.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$version'"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: create
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$state" = false ]; then
            echo "$TAG is already released; nothing to do."
            exit 0
          fi
          # A draft left by a failed run is replaced, so a retry starts clean.
          [ "$state" = true ] && gh release delete "$TAG" --yes
          gh release create "$TAG" --draft --target "$SHA" --title "Coxswain $TAG" --notes-file .github/release-notes.md
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # The SBOMs, the CBOM and the third-party notices (tools/bom/README.md), uploaded to the draft.
  # The terminal archives and the desktop installers take the notices from there.
  boms:
    needs: draft
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: boms
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      # The versions generate.sh expects; rust-cache keeps them between runs.
      - run: cargo install --locked cargo-cyclonedx@0.5.7 cargo-about@0.8.4
      - run: tools/bom/generate.sh dist-bom
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" dist-bom/*

  desktop:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest glibc still supported, so the AppImage runs on more distros
            args: ""
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      # The licences of everything inside, installed with the app. Only release builds bundle it,
      # through --config below, so other builds need no such file.
      - name: Third-party notices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md -D gui/src-tauri
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: gui
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }} --config '{"bundle":{"resources":["THIRD-PARTY-NOTICES.md"]}}'

  terminal:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Static musl binaries on Linux run on any distribution.
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p coxswain --target "$TARGET"
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="coxswain-terminal-$TAG-$TARGET"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md -D "$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/$TARGET/release/coxswain.exe target/$TARGET/release/cox.exe "$name/"
            7z a -bso0 "$name.zip" "$name"
            file="$name.zip"
          else
            cp target/$TARGET/release/coxswain target/$TARGET/release/cox "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          gh release upload "$TAG" "$file" "$file.sha256"

  publish:
    needs: [draft, boms, desktop, terminal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  aur:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [coxswain, coxswain-bin]
    env:
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so the AUR is not updated. See packaging/aur/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Set pkgver
        if: env.HAS_KEY == 'true'
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          PKG: ${{ matrix.pkg }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" "packaging/aur/$PKG/PKGBUILD"
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.HAS_KEY == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          commit_username: Michael W. Olesen
          commit_email: michael.w.olesen@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.draft.outputs.tag }}

  crates:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set, so crates.io is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: stable
      # Core first: the terminal app depends on it. Cargo waits until it is in the index.
      # crates.io allows only so many versions a day: when it says no, the next release
      # publishes everything since, so the release is not marked failed for it.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          publish() {
            if cargo publish --locked -p "$1" 2> err.txt; then return 0; fi
            cat err.txt >&2
            if grep -q "already exists" err.txt; then echo "::notice::$1 is on crates.io already"; return 0; fi
            if grep -q "429" err.txt; then echo "::warning::crates.io limits versions per day; $1 waits for the next release"; return 1; fi
            exit 1
          }
          publish coxswain-core && publish coxswain || true

  taps:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set, so Homebrew is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TAP_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Update mwo-dk/homebrew-coxswain
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          git config --global user.name "Michael W. Olesen"
          git config --global user.email michael.w.olesen@gmail.com
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/mwo-dk/homebrew-coxswain.git"
          packaging/taps/generate.sh "$TAG" homebrew-coxswain
          git -C homebrew-coxswain add -A
          # Only "no changes" is fine; a failed push must fail the job.
          if git -C homebrew-coxswain diff --cached --quiet; then
            echo "homebrew-coxswain: already up to date"
          else
            git -C homebrew-coxswain commit -qm "Coxswain ${TAG#v}"
            git -C homebrew-coxswain push -q
          fi
