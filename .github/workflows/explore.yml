name: Explore
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: explore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  netbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          release: "11.0"
          usesh: true
          prepare: |
            /usr/sbin/pkg_add pkgin || true
            pkgin -y install rust pkgconf webkit-gtk41 gtk3+ libsoup3 librsvg
            for t in tesseract poppler libreoffice pandoc plantuml nerd texlive gst-plugins1-good gstreamer1-plugins-good noto xdg-utils git ollama; do echo "## $t"; pkgin search "$t" | head -6; done
          run: |
            set -e
            uname -a; rustc -V
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast || echo TESTS-FAILED
            cargo test -p coxswain-gui --locked || echo GUI-FAILED
            rm -rf target

  openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add rust pkgconf webkitgtk41 librsvg
            for t in tesseract poppler libreoffice pandoc plantuml nerd texlive gst-plugins1-good gstreamer1-plugins-good noto xdg-utils git ollama; do echo "## $t"; pkg_info -Q "$t" | head -6; done
          run: |
            set -e
            uname -a; rustc -V; ulimit -a
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast || echo TESTS-FAILED
            cargo test -p coxswain-gui --locked || echo GUI-FAILED
            rm -rf target

  omnios:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        with:
          release: "r151058"
          usesh: true
          mem: 12288
          prepare: |
            pkg install build-essential ooce/developer/rust || true
            for t in webkit gtk3 tesseract poppler libreoffice pandoc nerd gstreamer noto git ollama; do echo "## $t"; pkg search -r -o pkg.name "*$t*" | head -6; done
          run: |
            set -e
            export PATH=/opt/ooce/bin:$PATH
            uname -a; rustc -V
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast -j2 || echo TESTS-FAILED
            COXSWAIN_ZFS_E2E=1 cargo test -p coxswain-core --test zfs --locked -- --nocapture || echo ZFS-FAILED
            rm -rf target
