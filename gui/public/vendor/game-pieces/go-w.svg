<!--
	Go: a white stone, lit from the top left, with a rim.
	Drawn for Coxswain's author's games project and given to Coxswain under its MIT
	licence; restyled to sit beside the chess set: 45×45, black lines 1.5 wide, a soft
	shading.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 45 45">
	<defs><radialGradient id="g" cx="0.35" cy="0.32" r="0.78"><stop offset="0" stop-color="#FFF"/><stop offset="0.55" stop-color="#f2ede1"/><stop offset="1" stop-color="#cfc6b2"/></radialGradient></defs>
	<circle cx="22.5" cy="22.5" r="20.7" fill="url(#g)" stroke="#8d8471" stroke-width="0.9"/>
</svg>
