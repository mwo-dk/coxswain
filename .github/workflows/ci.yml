name: CI

on:
  workflow_call: # from release.yml, for every push to master and every release
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A pull request that only edits docs pages, design notes, CLAUDE.md, LICENSE or a packaging
  # SUBMIT.md needs no build: the five machines below are skipped and "CI result" passes at once
  # (the docs job still runs). README.md and docs/changelog.md are not among them (the core crate
  # compiles the changelog in), nor docs/flags (the GUI embeds them), nor an added, removed or
  # renamed docs page (a test checks every page against features::FEATURES): those get a "page:"
  # prefix, which never skips.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}
      native: ${{ steps.files.outputs.native }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then printf 'code=true\nnative=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | if .status != "modified" and (.filename | test("^docs/.*\\.md$")) then "page:" + .filename else .filename end')
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvP '^(docs/(?!flags/|changelog\.md$)|design/|CLAUDE\.md$|LICENSE$|packaging/.*/SUBMIT\.md$)'; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi
          # Only texts (docs, README, changelog rows, locales, pictures): Linux builds and tests
          # them; macOS and Windows have nothing of their own to find there.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | sed 's/^page://' | grep -qvP '^(docs/|design/|changelog\.d/|crates/coxswain-core/locales/|README\.md$|CLAUDE\.md$|LICENSE$|packaging/.*/SUBMIT\.md$)'; then
            echo native=false >> "$GITHUB_OUTPUT"
          else
            echo native=true >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # The ARM machines run on every push to master and every release (called from release.yml),
      # not on pull requests; a pull request of texts only runs Linux. A skipped matrix entry is simply absent, so "CI result" is unaffected.
      matrix:
        os: ${{ fromJSON(github.event_name != 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]' || needs.changes.outputs.native == 'true' && '["ubuntu-24.04", "macos-latest", "windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          # mercurial: the tests of Mercurial repositories (vcs) run with it.
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev mercurial

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      # Saved from master only: a pull request's copy (a gigabyte or two each) would push the
      # nightly systems' caches (.github/actions/target-cache) out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # The Tauri crate embeds gui/dist at compile time, so the frontend builds first.
      - name: Frontend
        working-directory: gui
        shell: bash # PowerShell would carry on past a failing step
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check
          npm test
          npm run build

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked

      # The terminal app ships as a static musl binary (Homebrew, releases): whatever the
      # dependencies compile from C has to build for musl too, before a release finds out.
      - name: musl toolchain
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: musl-tools
      - name: Terminal app, static musl build
        if: runner.os == 'Linux'
        run: |
          target="$(uname -m)-unknown-linux-musl"
          rustup target add "$target"
          cargo build -p coxswain --target "$target" --locked

      # ARM Linux and Windows on ARM: releases bundle the desktop app there too, so the bundlers
      # have to run before a release finds out. A debug build, to reuse what the tests compiled;
      # no .rpm, whose packing of a debug binary takes over an hour on ARM.
      - name: Desktop installers on ARM
        if: runner.arch == 'ARM64' && runner.os != 'macOS'
        working-directory: gui
        shell: bash
        run: |
          npx tauri build --debug --ci --bundles ${{ runner.os == 'Linux' && 'deb,appimage' || 'nsis,msi' }}
          # The menu entry (gui/src-tauri/coxswain.desktop): a file manager, handed the files and
          # folders it is opened with.
          if [ "$RUNNER_OS" = Linux ]; then
            entry="$(dpkg-deb --fsys-tarfile ../target/debug/bundle/deb/*.deb | tar -xO --wildcards '*.desktop')"
            echo "$entry"
            grep -qx 'Exec=coxswain-gui %F' <<<"$entry"
            grep -qx 'Categories=System;FileTools;FileManager;' <<<"$entry"
          fi

      # Intel Macs: releases build for x86_64-apple-darwin too, with candle's Metal on, so this
      # target has to build before a release finds out.
      - name: Intel Mac build
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build -p coxswain --target x86_64-apple-darwin --locked

      # crates.io builds the core from its packaged files alone: anything it reads from
      # outside the crate (the README's changelog) has to come along, before a release finds out.
      - name: Core crate, packaged
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo package -p coxswain-core --locked

  # The docs are held to the code on every pull request and push, docs-only ones too: links and
  # anchors, the changelog rows, old versions as examples, and no screenshot placeholders left in a
  # minor or major release (tools/docs-check.py). What the code lists (themes, actions,
  # config.toml keys, flags) is checked by crates/coxswain-core/tests/docs.rs, in `test` above.
  docs:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The base branch's Cargo.toml says whether this raises the minor or major version.
      - name: Base branch
        if: github.base_ref != ''
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      - run: python3 tools/docs-check.py
      # Every theme, action, config.toml key, flag and feature has its mention in docs/. `test`
      # runs these on code changes (and every push to master); a docs-only pull request skips
      # `test`, so it runs them here.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: needs.changes.outputs.code == 'false'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.code == 'false'
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - if: needs.changes.outputs.code == 'false'
        run: cargo test -p coxswain-core --locked --test docs
      - if: needs.changes.outputs.code == 'false'
        run: cargo test -p coxswain-core --locked --lib features

  # The one check branch protection requires: the machines above passed, or were not needed, and
  # the docs are current.
  result:
    name: CI result
    needs: [changes, test, docs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST, docs: $DOCS"
          [ "$CHANGES" = success ] && [ "$DOCS" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }
