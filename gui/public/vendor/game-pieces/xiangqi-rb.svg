	<text x="22.5" y="22.5" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="'Noto Serif CJK TC', 'Noto Sans CJK TC', 'Noto Sans CJK SC', 'Source Han Sans', 'PingFang TC', 'Microsoft JhengHei', serif" fill="#8a2626">相</text>
