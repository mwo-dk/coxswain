[package]
name = "coxswain-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Coxswain: a Norton Commander style file manager, desktop edition"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coxswain-core.workspace = true
# No `devtools` feature: a release build has no inspector to open on a page a file rendered.
tauri = { version = "2", features = [] }
dirs = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
notify = "8"
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
kamadak-exif = "0.6.1"
lofty = "0.25.4"
x509-parser = "0.18.1"
plist = "1.10.1"
toml_edit = "0.25.15"

[features]
# Serve the built frontend (gui/dist) from inside the binary. Without it a plain `cargo build`
# loads the dev server at localhost:1420, which only `tauri dev` starts: run that one as
# `npx tauri dev -- --no-default-features`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The disks in the sidebar, where sysinfo knows the system and says which are removable;
# elsewhere the core reads them (`machine::mounted`): sysinfo's FreeBSD free space is wrong.
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

# Dragging files out of the window; on Linux and the BSDs GTK's own (`native_drag`).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
drag = "2.1.1"

# The title bar GTK draws keeps its first title; it is set as well (`set_title`).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18.2"

# Tests get a home of their own in the temporary folder (`coxswain_core::dirs`).
[dev-dependencies]
coxswain-core = { workspace = true, features = ["test-home"] }
