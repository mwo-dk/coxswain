[package]
name = "coxswain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core of Coxswain: config, file operations, git status and an Everything-style file name index"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25.15"
dirs = "7"
rayon = "1"
memchr = "2"
notify = "8"
regex = "1"
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
trash = "5.2.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
tar = "0.4.46"
flate2 = "1.1.10"
blake3 = "1.8.7"
sys-locale = "0.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
quick-xml = "0.42.0"
mail-parser = "0.11.9"
encoding_rs = "0.8.42"
pdf-extract = "0.12.1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
# candle-core turns on its `onig` regex backend (Oniguruma, C; it builds under musl-tools), so the
# pure-Rust `fancy-regex` backend would only be dead code next to it. 0.22 is what candle-core wants.
tokenizers = { version = "0.22", default-features = false }
sha2 = "0.11.0"
# The helper's token, from the system's random source.
getrandom = "0.3"
# More archive formats, all pure Rust: bzip2 (its default backend), xz, zstd, 7z with AES.
bzip2 = "0.6.1"
lzma-rust2 = "0.21.0"
ruzstd = "0.9.0"
sevenz-rust2 = { version = "0.23.0", features = ["aes256"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
