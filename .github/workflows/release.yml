name: Release

# Hands-off: when CI passes on master and the version in Cargo.toml has no release yet, build
# every platform, publish the GitHub Release (which creates the tag) and update the AUR,
# crates.io, Homebrew and WinGet.
# To release, bump `version` in Cargo.toml. Nothing else.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: # retry by hand if a runner hiccupped

# Read only, but for the jobs that make the release.
permissions:
  contents: read

# One release run at a time. Two overlapping runs for the same version would each treat the
# other's draft as a leftover and delete it mid-upload. Later runs wait instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    # `branches: [master]` above matches a fork's branch named master too: only a push to this
    # repository's master releases, and a retry by hand only from master.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$version'"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: create
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$state" = false ]; then
            echo "$TAG is already released; nothing to do."
            exit 0
          fi
          # A draft left by a failed run is replaced, so a retry starts clean.
          [ "$state" = true ] && gh release delete "$TAG" --yes
          gh release create "$TAG" --draft --target "$SHA" --title "Coxswain $TAG" --notes-file .github/release-notes.md
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # The SBOMs, the CBOM and the third-party notices (tools/bom/README.md), uploaded to the draft.
  # The terminal archives and the desktop installers take the notices from there.
  boms:
    needs: draft
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: boms
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      # The versions generate.sh expects; rust-cache keeps them between runs.
      - run: cargo install --locked cargo-cyclonedx@0.5.7 cargo-about@0.8.4
      - run: tools/bom/generate.sh dist-bom
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" dist-bom/*

  desktop:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest glibc still supported, so the AppImage runs on more distros
            args: ""
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      # The licences of everything inside, installed with the app. Only release builds bundle it,
      # through --config below, so other builds need no such file.
      - name: Third-party notices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        # GitHub's API answers a 500 now and then: try again before failing the release.
        run: for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md -D gui/src-tauri --clobber && exit 0; sleep $((i * 10)); done; exit 1
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: gui
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }} --config '{"bundle":{"resources":["THIRD-PARTY-NOTICES.md"]}}'

  terminal:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Static musl binaries on Linux run on any distribution.
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p coxswain --target "$TARGET"
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="coxswain-terminal-$TAG-$TARGET"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md -D "$name" --clobber && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/$TARGET/release/coxswain.exe target/$TARGET/release/cox.exe "$name/"
            7z a -bso0 "$name.zip" "$name"
            file="$name.zip"
          else
            cp target/$TARGET/release/coxswain target/$TARGET/release/cox "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          gh release upload "$TAG" "$file" "$file.sha256"

  # FreeBSD: both apps, built in a FreeBSD 14.5 virtual machine. The terminal app needs nothing
  # beyond the base system; the desktop app needs WebKitGTK from packages (install-freebsd.sh
  # installs them). docs/reference/freebsd.md.
  freebsd:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.5"
          usesh: true
          prepare: pkg install -y rust pkgconf webkit2-gtk_41 gtk3 libsoup3 librsvg2-rust
          run: |
            set -e
            cargo build --release --locked -p coxswain -p coxswain-gui
            mkdir out
            cp target/release/coxswain target/release/cox target/release/coxswain-gui out/
            rm -rf target
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md --clobber && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          target=x86_64-unknown-freebsd
          term="coxswain-terminal-$TAG-$target"
          desk="coxswain-desktop-$TAG-$target"
          mkdir "$term" "$desk"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$term/"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$desk/"
          cp out/coxswain out/cox crates/coxswain/coxswain.1 packaging/freebsd/coxswain_index "$term/"
          cp out/coxswain-gui "$desk/"
          cp gui/src-tauri/icons/128x128.png "$desk/coxswain.png"
          cp packaging/freebsd/coxswain.desktop "$desk/"
          for d in "$term" "$desk"; do
            tar czf "$d.tar.gz" "$d"
            sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
          done
          gh release upload "$TAG" "$term.tar.gz" "$term.tar.gz.sha256" "$desk.tar.gz" "$desk.tar.gz.sha256"

  publish:
    needs: [draft, boms, desktop, terminal, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.draft.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      # One SHA256SUMS over every download, the desktop installers included, so a download can
      # be checked against what this run uploaded.
      - name: Checksums
        run: |
          for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$REPO" -D assets --clobber && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          (cd assets && sha256sum * > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$TAG" --repo "$REPO" SHA256SUMS
      # Signed provenance: which commit and workflow built each download, verifiable with
      # `gh attestation verify <file> --repo mwo-dk/coxswain`. The release goes out without it
      # when the attestation service is down.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: assets/*
      - run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  aur:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [coxswain, coxswain-bin]
    env:
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so the AUR is not updated. See packaging/aur/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Set pkgver
        if: env.HAS_KEY == 'true'
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          PKG: ${{ matrix.pkg }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" "packaging/aur/$PKG/PKGBUILD"
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.HAS_KEY == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          commit_username: Michael W. Olesen
          commit_email: michael.w.olesen@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.draft.outputs.tag }}

  crates:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set, so crates.io is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: stable
      # Core first: the terminal app depends on it. Cargo waits until it is in the index.
      # crates.io allows only so many versions a day: when it says no, the next release
      # publishes everything since, so the release is not marked failed for it.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          publish() {
            if cargo publish --locked -p "$1" 2> err.txt; then return 0; fi
            cat err.txt >&2
            if grep -q "already exists" err.txt; then echo "::notice::$1 is on crates.io already"; return 0; fi
            if grep -q "429" err.txt; then echo "::warning::crates.io limits versions per day; $1 waits for the next release"; return 1; fi
            exit 1
          }
          publish coxswain-core && publish coxswain || true

  taps:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set, so Homebrew is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TAP_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Update mwo-dk/homebrew-coxswain
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          git config --global user.name "Michael W. Olesen"
          git config --global user.email michael.w.olesen@gmail.com
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/mwo-dk/homebrew-coxswain.git"
          packaging/taps/generate.sh "$TAG" homebrew-coxswain
          git -C homebrew-coxswain add -A
          # Only "no changes" is fine; a failed push must fail the job.
          if git -C homebrew-coxswain diff --cached --quiet; then
            echo "homebrew-coxswain: already up to date"
          else
            git -C homebrew-coxswain commit -qm "Coxswain ${TAG#v}"
            git -C homebrew-coxswain push -q
          fi

  # WinGet: each release is added to mwo-dk.Coxswain and mwo-dk.Coxswain.Terminal as a pull
  # request to microsoft/winget-pkgs, by Komac (pinned, checked by its SHA-256). Only updates: the
  # first version of each package is submitted by hand, and until Microsoft has listed it the job
  # says so and stops. Needs WINGET_TOKEN: a classic token with public_repo, from the account whose
  # fork of winget-pkgs the pull requests come from (packaging/README.md).
  winget:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set, so WinGet is not updated. See packaging/README.md."
      - name: Open winget-pkgs pull requests
        if: env.WINGET_TOKEN != ''
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL -o komac.tar.gz https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz
          echo "7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d  komac.tar.gz" | sha256sum -c -
          tar xzf komac.tar.gz komac
          v="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"
          notes="https://github.com/$REPO/releases/tag/$TAG"
          update() {
            # A package Microsoft has not listed yet waits for its first, hand-made submission.
            if ! ./komac list "$1" --token "$WINGET_TOKEN" >/dev/null 2>&1; then
              echo "::notice::$1 is not on WinGet yet; its first version waits for Microsoft's review."
              return 0
            fi
            ./komac update "$1" --version "$v" --urls "$2" --release-notes-url "$notes" --submit --token "$WINGET_TOKEN"
          }
          update mwo-dk.Coxswain "$base/Coxswain_${v}_x64-setup.exe"
          update mwo-dk.Coxswain.Terminal "$base/coxswain-terminal-$TAG-x86_64-pc-windows-msvc.zip"
