name: Nightly

# Every system's workflow on master, at night, when master changed since the last nightly run
# that passed: a push to master runs only what its pull request ran (release.yml), so a fault on
# a system no pull request started shows up the next morning. Not when master's head is a
# release, whose Release run tested every system already. By hand: always. And every night, a red
# `unreleased` job when the version in Cargo.toml has no published release (.github/unreleased.sh).
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(gh run list -R "$REPO" --workflow nightly.yml --branch master --status success --limit 1 --json headSha -q '.[0].headSha // empty')
          released=$(gh api "repos/$REPO/releases?per_page=5" -q "[.[] | select(.draft == false and .target_commitish == \"$GITHUB_SHA\")][0].tag_name // empty")
          if [ "$EVENT" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice title=Nothing new::master is still ${GITHUB_SHA:0:8}, tested by the last nightly run."; echo run=false >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = schedule ] && [ -n "$released" ]; then
            echo "::notice title=Nothing new::master is $released, whose Release run tested every system."; echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  # Every night: the version in Cargo.toml has a published release, or a Release run under way.
  unreleased:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/unreleased.sh

  freebsd:
    name: FreeBSD
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/freebsd.yml
  netbsd:
    name: NetBSD
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/netbsd.yml
  openbsd:
    name: OpenBSD
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/openbsd.yml
  illumos:
    name: illumos
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/illumos.yml
  termux:
    name: Termux
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/termux.yml
  flatpak:
    name: Flatpak
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/flatpak.yml
  nix:
    name: Nix
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/nix.yml
  # Files made by Excel and ChessBase, downloaded from where they are published (pinned by
  # SHA-256, kept in target/): crates/coxswain-core/tests/README.md. Not on pull requests.
  real-files:
    name: Real files
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Read the real files
        env:
          COXSWAIN_REAL_FILES: "1"
        run: cargo test --locked -p coxswain-core --test real_files -- --nocapture
      # The desktop app's table preview (SheetJS) on the same .xlsb files, from target/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Show the real workbooks as the desktop app does
        working-directory: gui
        env:
          COXSWAIN_REAL_FILES: "1"
        run: |
          npm ci --no-audit --no-fund
          node --test src/real-files.test.js
