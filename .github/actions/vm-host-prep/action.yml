# Installs on the Ubuntu runner the host packages a vmactions/*-vm step installs, with a
# fresh index, time limits, retries and other mirrors, so the action's own apt-get finds them
# installed and fetches nothing. The action installs from the runner image's index, which goes
# stale (ovmf 2024.02-2ubuntu0.9 was gone from every mirror, a 404), and its retry has no time
# limit: Release run 37662748644 hung 90 minutes in the FreeBSD job that way.
#
# The list is what install() in each pinned action's index.js asks for on x86_64 (freebsd-vm,
# netbsd-vm, openbsd-vm, omnios-vm, openindiana-vm: the same function). It adds rsync only for
# a builder before 2.0, and every release we use has 2.x. Check it when a pin moves.
#
# Four tries fit in the `timeout-minutes: 10` the calling step gives it.
name: VM host packages
description: Install the QEMU host packages a vmactions VM step needs, with retries and mirror fallback.
inputs:
  packages:
    description: Space-separated apt packages.
    default: qemu-utils qemu-system-x86 ovmf
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        set -u
        read -ra pkgs <<<"$PKGS"
        opts=(-q -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
              -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold)
        # Only the network part has a time limit: killing apt-get while dpkg unpacks leaves
        # dpkg broken for every later try. The .debs are fetched first, then installed from disk.
        get() {
          sudo timeout 40 apt-get update "${opts[@]}" || true
          sudo timeout 100 apt-get install -y --download-only --no-install-recommends "${opts[@]}" "${pkgs[@]}"
        }
        # Try 1 uses the runner's mirror list as it is; each later try puts a different mirror
        # first. The runner lists Azure, then archive.ubuntu.com, then security.ubuntu.com.
        firsts=("" http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ http://azure.archive.ubuntu.com/ubuntu/)
        list=/etc/apt/apt-mirrors.txt
        for i in 1 2 3 4; do
          first=${firsts[$((i - 1))]}
          if [ -n "$first" ]; then
            echo "::warning::Fetching ${pkgs[*]} failed (try $((i - 1)) of 4); next try with $first first, in $((5 * i)) s"
            sleep $((5 * i))
            if [ -f "$list" ]; then
              { echo "$first"; grep -vF "$first" "$list" | cut -f1; } |
                awk '{ print $0 "\tpriority:" NR }' | sudo tee "$list.new" >/dev/null
              sudo mv "$list.new" "$list"
              sed 's/\t/ /' "$list"
            else
              sudo sed -i 's|https\?://security\.ubuntu\.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
          fi
          if get; then
            sudo apt-get install -y --no-install-recommends "${opts[@]}" "${pkgs[@]}"
            exit 0
          fi
        done
        echo "::error::Could not fetch ${pkgs[*]} after 4 tries"
        exit 1
