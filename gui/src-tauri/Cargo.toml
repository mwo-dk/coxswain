[package]
name = "coxswain-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Coxswain: a Norton Commander style file manager, desktop edition"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coxswain-core.workspace = true
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
dirs = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
drag = "2.1.1"
notify = "8"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
kamadak-exif = "0.6.1"
lofty = "0.25.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1.13.1"
x509-parser = "0.18.1"
mail-parser = "0.11.9"
plist = "1.10.1"
toml_edit = "0.25.15"

[features]
# Serve the built frontend (gui/dist) from inside the binary. Without it a plain `cargo build`
# loads the dev server at localhost:1420, which only `tauri dev` starts: run that one as
# `npx tauri dev -- --no-default-features`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The title bar GTK draws keeps its first title; it is set as well (`set_title`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
