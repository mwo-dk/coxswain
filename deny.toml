# cargo deny: advisories, licences and duplicate crates. CI runs it on every PR and weekly.
[advisories]
ignore = [
  "RUSTSEC-2024-0436", # paste: unmaintained; proc macro inside gemm, pulled by candle
  "RUSTSEC-2024-0370", # proc-macro-error: unmaintained; proc macro inside glib 0.18, pulled by tauri
  "RUSTSEC-2026-0192", # ttf-parser: unmaintained; font parsing inside lopdf, pulled by pdf-extract
]

[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "0BSD", "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "Unicode-3.0", "MPL-2.0",
  "CDLA-Permissive-2.0", "bzip2-1.0.6",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# FreeBSD's desktop app, until the fixes are released (Cargo.toml, [patch.crates-io]): tao's own
# repository, and our fork of drag with its BSD fix (crabnebula-dev/drag-rs#99).
allow-git = ["https://github.com/tauri-apps/tao", "https://github.com/mwo-dk/drag-rs"]
