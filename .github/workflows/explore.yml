name: Explore
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: explore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  netbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          release: "10.1"
          usesh: true
          prepare: |
            /usr/sbin/pkg_add pkgin || true
            pkgin -y install rust pkgconf webkit-gtk41 gtk3+ libsoup3 librsvg || true
            grep -i 'no pkg\|unresolved' /var/db/pkgin/pkg_install-err.log | head || true
          run: |
            set -e
            uname -a; rustc -V
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 || true
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast || echo TESTS-FAILED
            cargo test -p coxswain-gui --locked || echo GUI-FAILED
            cargo build -p coxswain-gui --locked || true
            
            if [ -x target/debug/coxswain-gui ]; then
              Xvfb :99 -screen 0 1280x800x24 </dev/null >/dev/null 2>&1 &
              xpid=$!
              sleep 3
              mkdir -p /tmp/home && HOME=/tmp/home DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 target/debug/coxswain-gui "$PWD" </dev/null >gui.log 2>&1 &
              pid=$!
              sleep 45
              kill -0 $pid && echo GUI-RUNNING || echo GUI-DIED
              xwd -root -display :99 -silent > shot.xwd || true
              kill $pid || true
              sleep 2; pkill -f WebKit || true; kill $xpid || true
              tail -40 gui.log
            fi
            
            cargo build --release -p coxswain --locked
            mkdir -p /usr/local/bin && cp target/release/coxswain /usr/local/bin/
            ldd /usr/local/bin/coxswain
            useradd -m alice
            cp packaging/netbsd/coxswain_index /etc/rc.d/ && chmod 555 /etc/rc.d/coxswain_index
            /etc/rc.d/coxswain_index onestart && echo SVC-STARTED-WITHOUT-USER || echo SVC-REFUSED-OK
            printf 'coxswain_index=YES\ncoxswain_index_user=alice\n' >> /etc/rc.conf
            /etc/rc.d/coxswain_index start; sleep 8
            /etc/rc.d/coxswain_index status && echo SVC-STATUS-OK
            ps -aux -U alice; ls -la ~alice/.cache/coxswain || true
            /etc/rc.d/coxswain_index stop; sleep 3
            pgrep -U alice coxswain && echo SVC-STILL-RUNNING || echo SVC-STOPPED-OK
            
            rm -rf target
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: out-netbsd
          path: |
            shot.xwd
            gui.log
          if-no-files-found: ignore

  openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add -u
            pkg_add rust webkitgtk41 librsvg
            pkg_info -Q gstreamer | head -20
            pkg_info -Q symbols | head; pkg_info -Q texlive_texmf | head
          run: |
            set -e
            uname -a; rustc -V
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test -p coxswain-core -p coxswain -p coxswain-gui --locked --no-fail-fast || echo TESTS-FAILED
            cargo build -p coxswain-gui --locked
            
            if [ -x target/debug/coxswain-gui ]; then
              Xvfb :99 -screen 0 1280x800x24 </dev/null >/dev/null 2>&1 &
              xpid=$!
              sleep 3
              mkdir -p /tmp/home && HOME=/tmp/home DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 target/debug/coxswain-gui "$PWD" </dev/null >gui.log 2>&1 &
              pid=$!
              sleep 45
              kill -0 $pid && echo GUI-RUNNING || echo GUI-DIED
              xwd -root -display :99 -silent > shot.xwd || true
              kill $pid || true
              sleep 2; pkill -f WebKit || true; kill $xpid || true
              tail -40 gui.log
            fi
            
            cargo build --release -p coxswain --locked
            cp target/release/coxswain /usr/local/bin/
            ldd /usr/local/bin/coxswain
            useradd -m alice
            cp packaging/openbsd/coxswain_index /etc/rc.d/ && chmod 555 /etc/rc.d/coxswain_index
            rcctl -f start coxswain_index && echo SVC-STARTED-WITHOUT-USER || echo SVC-REFUSED-OK
            rcctl set coxswain_index user alice
            rcctl enable coxswain_index
            rcctl start coxswain_index; sleep 8
            rcctl check coxswain_index && echo SVC-STATUS-OK
            ps -U alice -o pid,command; ls -la /home/alice/.cache/coxswain || true
            rcctl stop coxswain_index; sleep 3
            pgrep -U alice coxswain && echo SVC-STILL-RUNNING || echo SVC-STOPPED-OK
            
            rm -rf target
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: out-openbsd
          path: |
            shot.xwd
            gui.log
          if-no-files-found: ignore

  omnios:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        with:
          release: "r151058"
          usesh: true
          mem: 12288
          prepare: |
            pkg install build-essential ooce/developer/rust || true
          run: |
            set -e
            export PATH=/opt/ooce/bin:$PATH
            uname -a; rustc -V; echo "PATH default: $(grep '^PATH' /etc/default/login || true)"
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test -p coxswain-core -p coxswain --locked --no-fail-fast -j2 || echo TESTS-FAILED
            COXSWAIN_ZFS_E2E=1 cargo test -p coxswain-core --test zfs --locked -- --nocapture || echo ZFS-FAILED
            
            cargo build --release -p coxswain --locked
            mkdir -p /usr/local/bin && cp target/release/coxswain /usr/local/bin/ && cp target/release/coxswain coxswain-illumos
            ldd /usr/local/bin/coxswain
            useradd -m -d /export/home/alice alice || useradd -d /export/home/alice alice
            mkdir -p /export/home/alice && chown alice /export/home/alice
            cp packaging/illumos/coxswain-index.xml /var/svc/manifest/site/
            svccfg import /var/svc/manifest/site/coxswain-index.xml
            svcs -a | grep coxswain
            svcadm enable application/coxswain-index; sleep 8
            svcs -x application/coxswain-index; svcs application/coxswain-index | grep -q maintenance && echo SVC-REFUSED-OK
            svcadm disable -s application/coxswain-index
            svccfg -s application/coxswain-index setprop start/user = astring: alice
            svcadm refresh application/coxswain-index
            svcadm clear application/coxswain-index || true
            svcadm enable application/coxswain-index; sleep 10
            svcs -p application/coxswain-index; svcs application/coxswain-index | grep -q online && echo SVC-ONLINE-OK
            ps -fu alice; ls -la /export/home/alice/.cache/coxswain || true
            cat "$(svcs -L application/coxswain-index)" | tail -20
            svcadm disable -s application/coxswain-index; sleep 2
            pgrep -u alice coxswain && echo SVC-STILL-RUNNING || echo SVC-STOPPED-OK
            ls -la /usr/gnu/bin/diff; pkg list -a 'text/gnu-diffutils' || true
            
            rm -rf target
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: out-omnios
          path: |
            coxswain-illumos
          if-no-files-found: ignore

  openindiana:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: omnios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: out-omnios
      - uses: vmactions/openindiana-vm@f0ed27ca85a6d1f5b11e4242eba1d6effa5aaae2 # v1.1.8
        with:
          release: "202604"
          usesh: true
          run: |
            uname -a; cat /etc/release | head -2
            chmod +x coxswain-illumos
            ldd ./coxswain-illumos
            ./coxswain-illumos --version && echo OI-RUNS || echo OI-FAILS
            pkg list -a '*webkit*' '*webkit2*' 2>&1 | head -20
            pkg list -a '*gtk3*' '*libsoup*' '*rust*' 2>&1 | head -20
