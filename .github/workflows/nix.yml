name: Nix

# The flake's packages built with Nix: the terminal app on Linux and macOS with its tests, the
# desktop app on Linux. Nightly when master changed, and in every release; pull requests only
# when the Cargo or npm lock files or the Nix files change.
on:
  workflow_dispatch:
  workflow_call: # from release.yml (a release or rehearsal; a master push touching the paths below) and nightly.yml
  pull_request:
    # Pull requests run this system only when its own packaging or workflow changes; every
    # other change is tested on it nightly and in every Release run (CLAUDE.md, Shipping).
    paths:
      - "flake.nix"
      - "flake.lock"
      - "packaging/nix/**"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: nix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Nix, ${{ matrix.os }}
    # A release pull request's (release/X.Y.Z) run is its Release run, after the merge.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The packages' compiled dependencies (crane's buildDepsOnly, packaging/nix/package.nix),
      # kept between runs as a binary cache in a folder: a store path that changes only with
      # Cargo.lock, a Cargo.toml, the Nix files or flake.lock, so only the workspace's own crates
      # are compiled. Unsigned, so trusted by name; it comes only from this repository's caches
      # (a pull request's from its own runs or master's). A new key is saved only when the paths
      # change, holding only the current ones; GitHub's LRU eviction drops the older keys.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nix-deps
          key: nix-deps-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', 'packaging/nix/*.nix') }}
          restore-keys: nix-deps-v1-${{ runner.os }}-
      - run: mkdir -p nix-deps
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: extra-substituters = file://${{ github.workspace }}/nix-deps?trusted=true

      - name: Terminal app
        run: |
          nix build -L .#default
          ./result/bin/coxswain --version
          ./result/bin/cox --version
          test -f result/share/man/man1/coxswain.1.gz
          nix run . -- --version

      - name: Desktop app
        if: runner.os == 'Linux'
        run: |
          nix build -L .#coxswain-gui -o result-gui
          test -f result-gui/share/applications/coxswain.desktop
          # Every library found, and the wrapped program starts: as the search helper it needs
          # no display, and runs until it is stopped.
          ! ldd result-gui/bin/.coxswain-gui-wrapped | grep 'not found'
          export HOME=$(mktemp -d)
          timeout 5 result-gui/bin/coxswain-gui --index-helper || test $? = 124

      - name: Dependencies, for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          deps=".#coxswain.cargoArtifacts"
          [ "$RUNNER_OS" = Linux ] && deps="$deps .#coxswain-gui.cargoArtifacts"
          # With their closure (the crates' sources), less what cache.nixos.org has. Made apart:
          # the daemon (root) makes folders in nix-deps while it looks for paths there.
          nix copy --to "file://$PWD/nix-deps.new?compression=zstd" $deps
          nix path-info -r $deps | cut -c12-43 | xargs -P 16 -I{} sh -c \
            'curl -sfI -o /dev/null https://cache.nixos.org/{}.narinfo || exit 0; rm -f "nix-deps.new/$(sed -n "s/^URL: //p" nix-deps.new/{}.narinfo)" nix-deps.new/{}.narinfo'
          ls nix-deps.new/*.narinfo | wc -l
          du -sh nix-deps.new
          sudo rm -rf nix-deps
          mv nix-deps.new nix-deps
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nix-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

  # The packages prepared for nixpkgs (packaging/nix/nixpkgs, see SUBMIT.md), built from the
  # release they name with the flake's nixpkgs, as nixpkgs would build them. They change only
  # by hand, so only by hand: `gh workflow run nix.yml` (it builds the flake as well).
  nixpkgs:
    name: Nix, the nixpkgs packages
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Nix'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build
        run: |
          for p in coxswain coxswain-gui; do
            nix build -L --keep-going --impure -o $p --expr "(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.\${builtins.currentSystem}.callPackage ./packaging/nix/nixpkgs/$p/package.nix { }" || fail=1
          done
          test -z "$fail"
          ./coxswain/bin/coxswain --version
