[package]
name = "spike-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = ["wasmtime"]
# Cranelift, compiling to the machine's own code.
wasmtime = ["dep:wasmtime"]
# Wasmtime's own interpreter (Cranelift compiles to its bytecode): for systems without a
# Cranelift backend.
pulley = ["wasmtime", "wasmtime/pulley"]
# An interpreter of core modules (no component model): the hand-made ABI in wasmi.rs.
wasmi = ["dep:wasmi"]
# The terminal grid demo.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
spike-games = { path = "../games" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = ">=40, <52", optional = true, default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation"] }
wasmi = { version = ">=1, <3", optional = true }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", optional = true }
