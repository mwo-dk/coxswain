[package]
name = "coxswain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Coxswain: a Norton Commander style file manager for the terminal"

# The program is the library, so it is built and tested once; the two names call it.
[lib]
doctest = false

[[bin]]
name = "coxswain"
path = "src/bin/coxswain.rs"
test = false

# The same program under a name that is quick to type.
[[bin]]
name = "cox"
path = "src/bin/cox.rs"
test = false

[dependencies]
coxswain-core.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
unicode-normalization = "0.1.25"
serde_json = "1"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

