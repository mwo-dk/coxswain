name: Release

# One run for each push to master: it tests every system and, when the version in Cargo.toml has
# no release yet, builds every platform, checks that every file is there, publishes the GitHub
# Release (which creates the tag) and updates crates.io, Homebrew, WinGet and the FreeBSD port.
# To release, bump `version` in Cargo.toml. Nothing else. A push without a new version only tests.
#
#   version ─┬─ test-ci, test-freebsd, test-netbsd, test-openbsd, test-illumos,
#            │  test-termux, test-flatpak, test-nix          (the systems' own workflows, in parallel)
#            └─ draft ── boms ── desktop, terminal, freebsd, other-unix ── verify ── publish
#                                                                                  ├─ crates, taps, winget,
#                                                                                  │  freebsd-port, aur
#                                                     (anything failed: discard) ──┘
#
# Never a partial release: every system and every file, or nothing. A failed test stops the run
# before the draft; a missing file stops it before publishing, and the draft is deleted. A
# channel that still fails after its retries turns the run red, named. release-check.yml then
# installs the release and checks every channel.
on:
  push:
    branches: [master]
  workflow_dispatch: # again by hand, from master: tests everything again and releases what is missing

permissions:
  contents: read

# The tests of one commit run once to the end; two runs for one commit (a push and a run by
# hand) wait for each other. Two commits with the same version: the `draft` job's group below
# lets only one of them make the release.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Cheap, and first: whether this version still needs a release. Releases only from this
  # repository's master.
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      release: ${{ steps.v.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$version' in Cargo.toml"; exit 1; }
          tag="v$version"
          { echo "tag=$tag"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          if [ "$REPO" != mwo-dk/coxswain ] || [ "$REF" != refs/heads/master ]; then
            echo "Not this repository's master: only the tests run."; echo release=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          if draft="$(gh release view "$tag" --json isDraft -q .isDraft 2>err)"; then
            if [ "$draft" = false ]; then
              echo "::notice title=Tests only::$tag is released already: this run only tests."
              echo release=false >> "$GITHUB_OUTPUT"; exit 0
            fi
          elif ! grep -q "release not found" err; then
            cat err >&2; exit 1
          fi
          echo "::notice title=Release::$tag has no release yet: once every system passes, this run releases it."
          echo release=true >> "$GITHUB_OUTPUT"

  # Every system's own workflow, as part of this run. Pull requests run them by themselves.
  test-ci:
    name: CI
    uses: ./.github/workflows/ci.yml
  test-freebsd:
    name: FreeBSD
    uses: ./.github/workflows/freebsd.yml
  test-netbsd:
    name: NetBSD
    uses: ./.github/workflows/netbsd.yml
  test-openbsd:
    name: OpenBSD
    uses: ./.github/workflows/openbsd.yml
  test-illumos:
    name: illumos
    uses: ./.github/workflows/illumos.yml
  test-termux:
    name: Termux
    uses: ./.github/workflows/termux.yml
  test-flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml
  test-nix:
    name: Nix
    uses: ./.github/workflows/nix.yml

  # The gate, then the draft. One release run for a version at a time: a second run for the same
  # version (a later commit that did not bump it) waits here, then sees the first run's draft and
  # leaves the release to it, or its published release and stops.
  draft:
    needs: [version, test-ci, test-freebsd, test-netbsd, test-openbsd, test-illumos, test-termux, test-flatpak, test-nix]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' }}
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ needs.version.outputs.tag }}
      sha: ${{ needs.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - name: Every system passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.key != "version" and .value.result != "success") | "\(.key) (\(.value.result))"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            while read -r f; do echo "::error title=No release::$f did not pass: $TAG is not released."; done <<<"$failed"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}
      - id: create
        env:
          REPO: ${{ github.repository }}
        run: |
          # The draft says which run makes it, in a comment of its notes.
          if info="$(gh release view "$TAG" --json isDraft,body 2>err)"; then
            if [ "$(jq -r .isDraft <<<"$info")" = false ]; then
              echo "::notice::$TAG was released meanwhile by another run."; exit 0
            fi
            owner="$(jq -r .body <<<"$info" | sed -n 's/^<!-- release run \([0-9]*\) -->$/\1/p')"
            if [ -n "$owner" ] && [ "$owner" != "$GITHUB_RUN_ID" ] &&
               [ "$(gh run view "$owner" --repo "$REPO" --json status -q .status)" != completed ]; then
              echo "::notice::Run $owner is releasing $TAG: this run leaves it to that one."; exit 0
            fi
            # A draft no run is working on any more: replaced, so this run starts clean.
            packaging/retry.sh gh release delete "$TAG" --yes
          elif ! grep -q "release not found" err; then
            cat err >&2; exit 1
          fi
          { cat .github/release-notes.md; printf '\n<!-- release run %s -->\n' "$GITHUB_RUN_ID"; } > notes.md
          packaging/retry.sh gh release create "$TAG" --draft --target "$SHA" --title "Coxswain $TAG" --notes-file notes.md
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # The SBOMs, the CBOM and the third-party notices (tools/bom/README.md), uploaded to the draft.
  # The terminal archives and the desktop installers take the notices from there.
  boms:
    needs: draft
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: boms
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      # The versions generate.sh expects; rust-cache keeps them between runs.
      - run: cargo install --locked cargo-cyclonedx@0.5.7 cargo-about@0.8.4
      - run: tools/bom/generate.sh dist-bom
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: for i in 1 2 3 4 5; do gh release upload --clobber "$TAG" dist-bom/* && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done

  desktop:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest glibc still supported, so the AppImage runs on more distros
            args: ""
          # ARM64 Linux (Raspberry Pi OS 64-bit, Asahi, ARM servers, ChromeOS): 22.04's glibc 2.35,
          # so the .deb and AppImage run on Debian 12 / Raspberry Pi OS Bookworm (2.36) too.
          - os: ubuntu-22.04-arm
            args: ""
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
          - os: windows-11-arm # Windows on ARM, native
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      # The licences of everything inside, installed with the app. Only release builds bundle it,
      # through --config below, so other builds need no such file.
      - name: Third-party notices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        # GitHub's API answers a 500 now and then: try again before failing the release.
        run: for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md -D gui/src-tauri --clobber && exit 0; sleep $((i * 10)); done; exit 1
      # Developer ID signing and notarisation, when the Apple secrets are set: macOS then keeps
      # its privacy answers (Desktop, Documents …) from one version to the next. Without them
      # the app is ad-hoc signed (tauri.conf.json's "-"), as before. docs/reference/macos.md.
      - name: Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::notice title=macOS signing::No APPLE_CERTIFICATE secret: the app is ad-hoc signed and not notarised."
            exit 0
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application"
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
              printf '%s<<APPLE_EOF\n%s\nAPPLE_EOF\n' "$name" "${!name}"
            done
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                printf '%s<<APPLE_EOF\n%s\nAPPLE_EOF\n' "$name" "${!name}"
              done
            fi
          } >> "$GITHUB_ENV"
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice title=macOS signing::Signed with the Developer ID, but not notarised: APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID is missing."
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: gui
          releaseId: ${{ needs.draft.outputs.id }}
          # GitHub's upload API answers a 500 now and then (2.8.1): try an upload again.
          retryAttempts: 3
          args: ${{ matrix.args }} --config '{"bundle":{"resources":["THIRD-PARTY-NOTICES.md"]}}'

  terminal:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: musl toolchain
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: musl-tools
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Static musl binaries on Linux run on any distribution.
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p coxswain --target "$TARGET"
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="coxswain-terminal-$TAG-$TARGET"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md -D "$name" --clobber && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/$TARGET/release/coxswain.exe target/$TARGET/release/cox.exe "$name/"
            7z a -bso0 "$name.zip" "$name"
            file="$name.zip"
          else
            cp target/$TARGET/release/coxswain target/$TARGET/release/cox "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          for i in 1 2 3 4 5; do gh release upload --clobber "$TAG" "$file" "$file.sha256" && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done

  # FreeBSD: both apps, built in a FreeBSD 14.5 virtual machine. The terminal app needs nothing
  # beyond the base system; the desktop app needs WebKitGTK from packages (install-freebsd.sh
  # installs them). docs/reference/freebsd.md.
  freebsd:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: qemu-utils qemu-system-x86 ovmf # what each pinned vmactions action's install() asks for on x86_64
          recommends: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.5"
          usesh: true
          prepare: pkg install -y rust pkgconf webkit2-gtk_41 gtk3 libsoup3 librsvg2-rust
          run: |
            set -e
            cargo build --release --locked -p coxswain -p coxswain-gui
            mkdir out
            cp target/release/coxswain target/release/cox target/release/coxswain-gui out/
            rm -rf target
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md --clobber && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          target=x86_64-unknown-freebsd
          term="coxswain-terminal-$TAG-$target"
          desk="coxswain-desktop-$TAG-$target"
          mkdir "$term" "$desk"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$term/"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$desk/"
          cp out/coxswain out/cox crates/coxswain/coxswain.1 packaging/freebsd/coxswain_index "$term/"
          cp out/coxswain-gui "$desk/"
          cp gui/src-tauri/icons/128x128.png "$desk/coxswain.png"
          cp packaging/freebsd/coxswain.desktop "$desk/"
          for d in "$term" "$desk"; do
            tar czf "$d.tar.gz" "$d"
            sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
          done
          for i in 1 2 3 4 5; do gh release upload --clobber "$TAG" "$term.tar.gz" "$term.tar.gz.sha256" "$desk.tar.gz" "$desk.tar.gz.sha256" && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done

  # NetBSD, OpenBSD and illumos: the terminal app (and on OpenBSD the desktop app, experimental),
  # each built in a virtual machine of that system and packed here (packaging/pack-unix.sh).
  # A failure of one of them stops the release: every system ships, or none.
  # docs/reference/netbsd.md, openbsd.md, illumos.md.
  other-unix:
    needs: [draft, boms]
    if: needs.draft.outputs.id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: netbsd, target: x86_64-unknown-netbsd, service: packaging/netbsd/coxswain_index }
          - { sys: openbsd, target: x86_64-unknown-openbsd, service: packaging/openbsd/coxswain_index }
          - { sys: illumos, target: x86_64-unknown-illumos, service: packaging/illumos/coxswain-index.xml }
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.sys == 'openbsd'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend
        if: matrix.sys == 'openbsd'
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules
      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: qemu-utils qemu-system-x86 ovmf # what each pinned vmactions action's install() asks for on x86_64
          recommends: false
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        if: matrix.sys == 'netbsd'
        with:
          release: "10.1"
          usesh: true
          prepare: |
            /usr/sbin/pkg_add pkgin || true
            pkgin -y install rust pkgconf
          run: |
            set -e
            cargo build --release --locked -p coxswain
            mkdir out && cp target/release/coxswain out/
            rm -rf target
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        if: matrix.sys == 'openbsd'
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add -u
            pkg_add rust webkitgtk41 librsvg
          run: |
            set -e
            cargo build --release --locked -p coxswain -p coxswain-gui
            mkdir out && cp target/release/coxswain target/release/coxswain-gui out/
            rm -rf target
      - uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        if: matrix.sys == 'illumos'
        with:
          release: "r151058"
          usesh: true
          mem: 12288
          prepare: pkg install build-essential ooce/developer/rust
          run: |
            set -e
            PATH="/opt/ooce/bin:$PATH" cargo build --release --locked -p coxswain
            mkdir out && cp target/release/coxswain out/
            rm -rf target
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          for i in 1 2 3 4 5; do gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p THIRD-PARTY-NOTICES.md --clobber && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          sh packaging/pack-unix.sh "$TAG" "${{ matrix.target }}" out dist "${{ matrix.service }}"
          if [ -f out/coxswain-gui ]; then
            desk="coxswain-desktop-$TAG-${{ matrix.target }}"
            mkdir "$desk"
            cp LICENSE README.md THIRD-PARTY-NOTICES.md out/coxswain-gui packaging/freebsd/coxswain.desktop "$desk/"
            cp gui/src-tauri/icons/128x128.png "$desk/coxswain.png"
            tar czf "dist/$desk.tar.gz" "$desk"
            (cd dist && sha256sum "$desk.tar.gz" > "$desk.tar.gz.sha256")
          fi
          for i in 1 2 3 4 5; do gh release upload --clobber "$TAG" dist/* && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done

  # Every file the matrices above make (packaging/release-assets.sh), each archive's .sha256 and
  # one SHA256SUMS over all of them, or no release: on any gap this fails, says what is missing,
  # and `discard` deletes the draft.
  verify:
    needs: [draft, boms, desktop, terminal, freebsd, other-unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.draft.outputs.tag }}
      ID: ${{ needs.draft.outputs.id }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Every file, uploaded completely
        run: |
          gh api --paginate "repos/$REPO/releases/$ID/assets" -q '.[] | [.name, .state, .size] | @tsv' | tee listed.tsv
          bad=$(awk -F'\t' '$2 != "uploaded" || $3 == 0 { print $1 " (" $2 ", " $3 " bytes)" }' listed.tsv | xargs)
          [ -z "$bad" ] || { echo "::error title=$TAG is not complete::not uploaded completely: $bad"; exit 1; }
      - name: Every file, and its checksums
        run: |
          packaging/retry.sh gh release download "$TAG" --repo "$REPO" -D assets --clobber
          packaging/release-assets.sh "$TAG" assets
          # One SHA256SUMS over every download, the desktop installers included, so a download can
          # be checked against what this run uploaded.
          (cd assets && rm -f SHA256SUMS && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          packaging/retry.sh gh release upload --clobber "$TAG" --repo "$REPO" SHA256SUMS
      - name: The draft, as it will be published
        run: |
          # Exactly the list and SHA256SUMS, and SHA256SUMS naming every one.
          gh api --paginate "repos/$REPO/releases/$ID/assets" -q '.[].name' | LC_ALL=C sort > names
          { packaging/release-assets.sh "$TAG"; echo SHA256SUMS; } | LC_ALL=C sort | diff -u - names ||
            { echo "::error title=$TAG is not complete::the draft's files differ from the list (above)"; exit 1; }
          awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort | diff -u <(grep -vx SHA256SUMS names) - ||
            { echo "::error title=$TAG is not complete::SHA256SUMS does not name every file (above)"; exit 1; }
      # Signed provenance: which commit and workflow built each download, verifiable with
      # `gh attestation verify <file> --repo mwo-dk/coxswain`. The release goes out without it
      # when the attestation service is down.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: assets/*

  publish:
    needs: [draft, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          REPO: ${{ github.repository }}
        # Two versions can be on their way at once: only the higher one becomes Latest.
        run: |
          latest="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)"
          newest="$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -1)"
          packaging/retry.sh gh release edit "$TAG" --repo "$REPO" --draft=false --latest="$([ "$newest" = "$TAG" ] && echo true || echo false)"

  # Anything between the draft and publishing failed, or the run was cancelled: the draft this
  # run made goes, so no half-made release is left behind. A run by hand starts again cleanly.
  discard:
    needs: [draft, boms, desktop, terminal, freebsd, other-unix, verify, publish]
    if: always() && needs.draft.outputs.id != '' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.draft.outputs.tag }}
      REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"' <<<"$NEEDS" | xargs)
          echo "::error title=No release::$TAG is not released: $failed. Its draft is deleted."
          info="$(gh release view "$TAG" --repo "$REPO" --json isDraft,body)" || exit 0
          if [ "$(jq -r .isDraft <<<"$info")" = true ] &&
             jq -r .body <<<"$info" | grep -qx "<!-- release run $GITHUB_RUN_ID -->"; then
            gh release delete "$TAG" --repo "$REPO" --yes
          fi

  # After publishing, the channels. Each tries again on a passing fault (packaging/retry.sh); one
  # that still fails turns this run red with an error naming it, and release-check.yml, which
  # runs when this run ends, says which channel lacks the version.

  # FreeBSD's ports tree: sysutils/coxswain brought to this version and built in a FreeBSD VM
  # (packaging/freebsd/update-port.sh); the result is this run's artifact. Once the port is in the
  # tree and FREEBSD_BUGZILLA_KEY is set, the update is filed in Bugzilla with its diff and
  # maintainer-approval (packaging/freebsd/README.md). Before that, a notice.
  freebsd-port:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: qemu-utils qemu-system-x86 ovmf # what each pinned vmactions action's install() asks for on x86_64
          recommends: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        with:
          release: "14.5"
          usesh: true
          envs: TAG
          prepare: pkg install -y git rust oniguruma portlint
          # Three tries: the ports tree and the distfiles come from far away. About 15 minutes each.
          run: |
            for i in 1 2 3; do
              sh packaging/freebsd/update-port.sh "$TAG" && exit 0
              echo "update-port.sh failed (try $i of 3)"; sleep 60
            done
            exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebsd-port
          path: |
            packaging/freebsd/sysutils/coxswain
            packaging/freebsd/out
      - name: File the update in Bugzilla
        env:
          FREEBSD_BUGZILLA_KEY: ${{ secrets.FREEBSD_BUGZILLA_KEY }}
          VERSION: ${{ needs.draft.outputs.tag }}
        run: |
          if [ -z "$FREEBSD_BUGZILLA_KEY" ]; then
            echo "::notice::FREEBSD_BUGZILLA_KEY is not set, so no Bugzilla PR is filed. The port is in this run's artifacts. See packaging/freebsd/README.md."
          elif [ "$(cat packaging/freebsd/out/in-tree)" != yes ]; then
            echo "::notice::sysutils/coxswain is not in the ports tree yet: submit it by hand first (packaging/freebsd/README.md). The port is in this run's artifacts."
          else
            python3 packaging/freebsd/file-bugzilla.py packaging/freebsd/out/port.diff
          fi
      - if: failure()
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: echo "::error title=Channel failed::FreeBSD port, $TAG"

  aur:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [coxswain, coxswain-bin]
    env:
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so the AUR is not updated. See packaging/aur/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Set pkgver
        if: env.HAS_KEY == 'true'
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          PKG: ${{ matrix.pkg }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" "packaging/aur/$PKG/PKGBUILD"
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.HAS_KEY == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          commit_username: Michael W. Olesen
          commit_email: michael.w.olesen@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.draft.outputs.tag }}
      - if: failure()
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          PKG: ${{ matrix.pkg }}
        run: echo "::error title=Channel failed::AUR, $PKG $TAG"

  crates:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set, so crates.io is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: stable
      # Core first: the terminal app depends on it. Cargo waits until it is in the index. A crate
      # already there (a run again by hand) is skipped.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          for p in coxswain-core coxswain; do
            if curl -fsS -A "coxswain release (github.com/mwo-dk/coxswain)" "https://crates.io/api/v1/crates/$p/${TAG#v}" >/dev/null; then
              echo "$p ${TAG#v} is on crates.io already"; continue
            fi
            packaging/retry.sh cargo publish --locked -p "$p"
          done
      - if: failure()
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: echo "::error title=Channel failed::crates.io, $TAG"

  taps:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set, so Homebrew is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TAP_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Update mwo-dk/homebrew-coxswain
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          git config --global user.name "Michael W. Olesen"
          git config --global user.email michael.w.olesen@gmail.com
          packaging/retry.sh git clone -q "https://x-access-token:$TAP_TOKEN@github.com/mwo-dk/homebrew-coxswain.git"
          # A higher version released meanwhile by another run stays.
          have="$(sed -n 's/^ *version "\(.*\)"/\1/p' homebrew-coxswain/Formula/coxswain.rb | head -1)"
          if [ "$(printf '%s\n' "${have:-0}" "${TAG#v}" | sort -V | tail -1)" != "${TAG#v}" ]; then
            echo "::notice::homebrew-coxswain has $have already, higher than ${TAG#v}: left as it is."; exit 0
          fi
          packaging/retry.sh packaging/taps/generate.sh "$TAG" homebrew-coxswain
          git -C homebrew-coxswain add -A
          # Only "no changes" is fine; a failed push must fail the job.
          if git -C homebrew-coxswain diff --cached --quiet; then
            echo "homebrew-coxswain: already up to date"
          else
            git -C homebrew-coxswain commit -qm "Coxswain ${TAG#v}"
            packaging/retry.sh git -C homebrew-coxswain push -q
          fi
      - if: failure()
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: echo "::error title=Channel failed::Homebrew tap, $TAG"

  # WinGet: each release is added to mwo-dk.Coxswain and mwo-dk.Coxswain.Terminal as a pull
  # request to microsoft/winget-pkgs, by Komac (pinned, checked by its SHA-256). Only updates: the
  # first version of each package is submitted by hand, and until Microsoft has listed it the job
  # says so and skips it. A version that has its pull request already is skipped too. Needs
  # WINGET_TOKEN: a classic token with public_repo, from the account whose fork of winget-pkgs
  # the pull requests come from (packaging/README.md).
  winget:
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set, so WinGet is not updated. See packaging/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WINGET_TOKEN != ''
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.sha }}
      - name: Open winget-pkgs pull requests
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          packaging/retry.sh curl -fsSL -o komac.tar.gz https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz
          echo "7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d  komac.tar.gz" | sha256sum -c -
          tar xzf komac.tar.gz komac
          v="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"
          notes="https://github.com/$REPO/releases/tag/$TAG"
          update() {
            id="$1"; shift
            # Listed: winget-pkgs has a manifest folder for one of its versions.
            listed=0; packaging/winget-listed.sh "$id" || listed=$?
            case $listed in
              1) echo "::notice::$id is not on WinGet yet; its first version waits for Microsoft's review."; return 0 ;;
              2) return 1 ;;
            esac
            has=0; packaging/winget-listed.sh "$id" "$v" || has=$?
            case $has in
              0) echo "$id $v has its pull request already"; return 0 ;;
              2) return 1 ;;
            esac
            packaging/retry.sh ./komac update "$id" --version "$v" --urls "$@" --release-notes-url "$notes" --submit --token "$WINGET_TOKEN"
          }
          # Komac takes each installer's architecture from the file: x64 and Windows on ARM.
          update mwo-dk.Coxswain "$base/Coxswain_${v}_x64-setup.exe" "$base/Coxswain_${v}_arm64-setup.exe"
          update mwo-dk.Coxswain.Terminal "$base/coxswain-terminal-$TAG-x86_64-pc-windows-msvc.zip" "$base/coxswain-terminal-$TAG-aarch64-pc-windows-msvc.zip"
      - if: failure()
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: echo "::error title=Channel failed::WinGet, $TAG"
