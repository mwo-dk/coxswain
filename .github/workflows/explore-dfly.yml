name: Explore DragonFly
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: explore-dfly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dragonfly:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41 # v1.3.4
        with:
          release: "6.4.2"
          usesh: true
      - name: Sysroot from the VM
        shell: dragonflybsd {0}
        run: |
          uname -a
          ls /usr/lib/gcc80 /usr/include/c++ | head
          tar czf dfly-sysroot.tgz /usr/include /usr/lib /lib
          ls -la dfly-sysroot.tgz
      - name: Cross-build on the host
        run: |
          set -e
          sudo apt-get install -y -q clang lld llvm >/dev/null
          rustup toolchain install nightly --profile minimal -c rust-src
          mkdir -p "$RUNNER_TEMP/sysroot" && tar xzf dfly-sysroot.tgz -C "$RUNNER_TEMP/sysroot" && rm dfly-sysroot.tgz
          printf '#!/bin/sh\nexec clang --target=x86_64-unknown-dragonfly --sysroot=%s -fuse-ld=lld "$@"\n' "$RUNNER_TEMP/sysroot" > "$RUNNER_TEMP/dfly-cc"
          printf '#!/bin/sh\nexec clang++ --target=x86_64-unknown-dragonfly --sysroot=%s -fuse-ld=lld "$@"\n' "$RUNNER_TEMP/sysroot" > "$RUNNER_TEMP/dfly-c++"
          chmod +x "$RUNNER_TEMP/dfly-cc" "$RUNNER_TEMP/dfly-c++"
          export CC_x86_64_unknown_dragonfly="$RUNNER_TEMP/dfly-cc" CXX_x86_64_unknown_dragonfly="$RUNNER_TEMP/dfly-c++" AR_x86_64_unknown_dragonfly=llvm-ar
          export CARGO_TARGET_X86_64_UNKNOWN_DRAGONFLY_LINKER="$RUNNER_TEMP/dfly-cc"
          export CARGO_PROFILE_DEV_DEBUG=line-tables-only
          cargo +nightly test -Zbuild-std=std,panic_abort --target x86_64-unknown-dragonfly -p coxswain-core -p coxswain --locked --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | "\(.manifest_path) \(.executable)"' | sed 's|/Cargo.toml||' > dfly-tests.txt
          cat dfly-tests.txt
          cargo +nightly build -Zbuild-std=std,panic_abort --target x86_64-unknown-dragonfly -p coxswain --release --locked
          file target/x86_64-unknown-dragonfly/release/coxswain
      - name: Tests in the VM
        shell: dragonflybsd {0}
        run: |
          set -e
          ldd target/x86_64-unknown-dragonfly/release/coxswain
          target/x86_64-unknown-dragonfly/release/coxswain --version
          fail=0
          while read -r dir exe; do
            echo "== $exe"
            (cd "$dir" && "$exe") || fail=1
          done < dfly-tests.txt
          [ "$fail" = 0 ] || echo TESTS-FAILED
