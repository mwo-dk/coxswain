name: Release check

# A published release, installed the way a user installs it: from its published downloads, with
# the install scripts of that tag, on each system they are for, and then started; and every
# channel checked for its version: crates.io, the Homebrew tap, WinGet, the FreeBSD port.
# Nothing waits for this workflow; a red run here is a release to fix at once. packaging/README.md.
#
# It runs when a Release run ends, whatever its result (a channel may have failed), and checks the
# release that run published; none when the version had one already. And by hand.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, e.g. v2.8.1, or latest
        default: latest

permissions:
  contents: read

concurrency:
  group: release-check-${{ inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  resolve:
    name: Which release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      run: ${{ github.event.workflow_run.id }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG" ;;
            # Only when that run published a release: a release of its commit.
            workflow_run)
              tag=$(gh api "repos/$REPO/releases?per_page=20" -q "[.[] | select(.draft == false and .target_commitish == \"$HEAD_SHA\")][0].tag_name // empty") ;;
          esac
          [ "$tag" = latest ] && tag=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $tag"; exit 1
          fi
          echo "Release: ${tag:-none}"
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "run=$RUN"; } >> "$GITHUB_OUTPUT"

  # Exactly the files the release should have (packaging/release-assets.sh), SHA256SUMS against
  # every download, and every .sha256 against its file.
  sums:
    name: GitHub release files
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          packaging/retry.sh gh release download "$TAG" --repo "$REPO" -D assets
          test -f assets/SHA256SUMS || { echo "::error::$TAG has no SHA256SUMS"; exit 1; }
          packaging/release-assets.sh "$TAG" assets

  # Each channel has this version. A channel's job in release.yml may have just finished, and
  # crates.io's and GitHub's search indexes lag a little: each check waits up to ten minutes.
  channels:
    name: Channels
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VER: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: crates.io
        if: ${{ !cancelled() }}
        run: |
          for p in coxswain-core coxswain; do
            for _ in $(seq 20); do
              curl -fsS -A "coxswain release check (github.com/mwo-dk/coxswain)" "https://crates.io/api/v1/crates/$p/$VER" >/dev/null && continue 2
              sleep 30
            done
            echo "::error title=crates.io::$p $VER is not on crates.io"; exit 1
          done
          echo "coxswain-core and coxswain $VER are on crates.io"
      - name: Homebrew
        if: ${{ !cancelled() }}
        run: |
          bad=0
          for f in Formula/coxswain.rb Casks/coxswain-gui.rb; do
            got=$(gh api "repos/mwo-dk/homebrew-coxswain/contents/$f" -H "Accept: application/vnd.github.raw" | sed -n 's/^ *version "\(.*\)"/\1/p' | head -1)
            # A higher version, released meanwhile, is fine too.
            if [ -n "$got" ] && [ "$(printf '%s\n' "$got" "$VER" | sort -V | head -1)" = "$VER" ]; then
              echo "$f: $got"
            else
              echo "::error title=Homebrew::$f is at '$got', not $VER"; bad=1
            fi
          done
          exit $bad
      - name: WinGet
        if: ${{ !cancelled() }}
        run: |
          bad=0
          for id in mwo-dk.Coxswain.Terminal mwo-dk.Coxswain; do
            listed=0; packaging/winget-listed.sh "$id" || listed=$?
            case $listed in
              1) echo "::notice title=WinGet::$id is not listed on WinGet yet: no pull request expected."; continue ;;
              2) echo "::error title=WinGet::could not tell whether $id is listed"; bad=1; continue ;;
            esac
            for _ in $(seq 20); do
              packaging/winget-listed.sh "$id" "$VER" && { echo "$id $VER: pull request open or merged"; continue 2; }
              sleep 30
            done
            echo "::error title=WinGet::no open or merged winget-pkgs pull request for $id $VER"; bad=1
          done
          exit $bad
      - name: FreeBSD port
        if: ${{ !cancelled() }}
        env:
          RUN: ${{ needs.resolve.outputs.run }}
        # The Release run that just ended, or (by hand) the runs of the release's commit.
        run: |
          if [ -z "$RUN" ]; then
            sha=$(gh api "repos/$REPO/releases/tags/$TAG" -q .target_commitish)
            RUN=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$sha&per_page=20" -q '.workflow_runs[].id' | xargs)
          fi
          for r in $RUN; do
            if gh api "repos/$REPO/actions/runs/$r/artifacts" -q '.artifacts[] | select(.expired == false) | .name' | grep -qx freebsd-port; then
              echo "FreeBSD port for $TAG: the freebsd-port artifact of run $r"; exit 0
            fi
          done
          echo "::error title=FreeBSD port::no freebsd-port artifact for $TAG (runs: ${RUN:-none})"; exit 1

  freebsd:
    name: FreeBSD ${{ matrix.release }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        with:
          release: ${{ matrix.release }}
          usesh: true
          envs: TAG
          run: |
            set -e
            freebsd-version
            fetch -qo - "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-freebsd.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            man -w coxswain
            test -x /usr/local/etc/rc.d/coxswain_index

  other-unix:
    name: ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: NetBSD 10.1, sys: netbsd }
          - { name: OpenBSD 7.9, sys: openbsd }
          - { name: OmniOS r151058, sys: omnios }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        if: matrix.sys == 'netbsd'
        with:
          release: "10.1"
          usesh: true
          envs: TAG
          run: |
            set -e
            uname -a
            ftp -o - "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-unix.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            man -w coxswain
            test -x /etc/rc.d/coxswain_index
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        if: matrix.sys == 'openbsd'
        with:
          release: "7.9"
          usesh: true
          envs: TAG
          run: |
            set -e
            uname -a
            ftp -o - "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-unix.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            man -w coxswain
            test -x /etc/rc.d/coxswain_index
      - uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        if: matrix.sys == 'omnios'
        with:
          release: "r151058"
          usesh: true
          envs: TAG
          run: |
            set -e
            uname -a
            curl -fsSL "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-unix.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            test -f /usr/local/share/man/man1/coxswain.1
            test -f /var/svc/manifest/site/coxswain-index.xml
            svcs application/coxswain-index

  linux:
    name: Linux ${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runs-on: ubuntu-24.04, deb: amd64 }
          - { arch: aarch64, runs-on: ubuntu-24.04-arm, deb: arm64 }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VER: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Download
        run: |
          term="coxswain-terminal-$TAG-${{ matrix.arch }}-unknown-linux-musl.tar.gz"
          deb="Coxswain_${VER}_${{ matrix.deb }}.deb"
          for f in SHA256SUMS "$term" "$deb"; do
            curl -fsSLO "https://github.com/$REPO/releases/download/$TAG/$f"
          done
          sha256sum -c --ignore-missing SHA256SUMS | tee sums.txt
          test "$(grep -c ': OK$' sums.txt)" = 2
          echo "TERM_ARCHIVE=$term" >> "$GITHUB_ENV"
          echo "DEB=$deb" >> "$GITHUB_ENV"
      - name: The terminal app, static
        run: |
          tar xzf "$TERM_ARCHIVE"
          bin="${TERM_ARCHIVE%.tar.gz}/coxswain"
          file -b "$bin" | tee /dev/stderr | grep -q 'static'
          test "$("$bin" --version)" = "coxswain $VER"
          "${TERM_ARCHIVE%.tar.gz}/cox" --version
          "$bin" --help >/dev/null
      - name: The desktop app, from the .deb with apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "./$DEB" xvfb
          dpkg -L coxswain
          test "$(dpkg-query -W -f '${Version}' coxswain)" = "$VER"
          if ldd /usr/bin/coxswain-gui | grep 'not found'; then exit 1; fi
          # It starts and stays up, on a display of its own.
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a coxswain-gui "$RUNNER_TEMP/home" >gui.log 2>&1 &
          sleep 30
          alive=0; pgrep -x coxswain-gui >/dev/null && alive=1
          pkill -x coxswain-gui || true
          tail -20 gui.log
          [ "$alive" = 1 ] || { echo "::error::The desktop app did not stay up"; exit 1; }

  # `cargo install` in Termux (termux-docker on ARM64, as on a phone), as the Termux guide says.
  termux:
    name: Termux, cargo install
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VER: ${{ needs.resolve.outputs.version }}
    steps:
      # The release pipeline publishes to crates.io after the release: wait for it.
      - name: On crates.io
        run: |
          for i in $(seq 60); do
            curl -fsS -A "coxswain release check" "https://crates.io/api/v1/crates/coxswain/$VER" >/dev/null && exit 0
            sleep 60
          done
          echo "::error::coxswain $VER is not on crates.io"; exit 1
      - name: Install and start in Termux
        run: |
          # termux-docker starts a login shell that drops -e variables: the version goes into
          # the command (it is X.Y.Z, checked above).
          docker run --rm termux/termux-docker:aarch64 bash -c "
            set -e
            pkg install -y rust clang binutils >/dev/null
            cargo install --locked coxswain --version $VER
            test \"\$(\$HOME/.cargo/bin/coxswain --version)\" = 'coxswain $VER'
            \$HOME/.cargo/bin/coxswain --help >/dev/null
          "
