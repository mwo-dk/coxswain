name: Release check

# A published release, installed the way a user installs it: from its published downloads, with
# the install scripts of that tag, on each system they are for, and then started. Nothing waits
# for this workflow; a red run here means a release that does not install, to be fixed in the
# next one. packaging/README.md.
#
# The release pipeline publishes with the workflow token, which starts no `release` event, so
# this also runs after every successful Release run and checks the release that run published
# (none when the version had one already). `release` covers a release published by hand.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [release-smoke]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, e.g. v2.8.1, or latest
        default: latest

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  resolve:
    name: Which release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$EVENT" in
            release) tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push) tag=v2.8.1 ;;
            # Only when that run published a release: the latest release is of its commit.
            workflow_run)
              tag=$(gh api "repos/$REPO/releases/latest" -q "select(.target_commitish == \"$HEAD_SHA\") | .tag_name") ;;
          esac
          [ "$tag" = latest ] && tag=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $tag"; exit 1
          fi
          echo "Release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # SHA256SUMS against every download, and every .sha256 against its file.
  sums:
    name: Checksums
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$REPO" -D assets
          cd assets
          sha256sum -c SHA256SUMS
          bad=0
          listed() { awk -v f="$1" '$2 == f || $2 == "*" f { found = 1 } END { exit !found }' SHA256SUMS; }
          for f in *; do
            [ "$f" = SHA256SUMS ] && continue
            if ! listed "$f"; then
              case "$f" in
                # A sum uploaded after SHA256SUMS was made: still checked below.
                *.sha256) echo "::warning::$f is not in SHA256SUMS" ;;
                *) echo "::error::$f is not in SHA256SUMS"; bad=1 ;;
              esac
            fi
            case "$f" in
              coxswain-terminal-*.tar.gz | coxswain-terminal-*.zip | coxswain-desktop-*.tar.gz)
                [ -f "$f.sha256" ] || { echo "::error::$f has no .sha256 (the install scripts need it)"; bad=1; } ;;
            esac
          done
          for s in *.sha256; do
            f=${s%.sha256}
            [ -f "$f" ] || { echo "::error::$s is the sum of $f, which is not in the release"; bad=1; continue; }
            [ "$(awk '{print $1}' "$s")" = "$(sha256sum "$f" | awk '{print $1}')" ] || { echo "::error::$s does not match $f"; bad=1; }
          done
          exit $bad

  freebsd:
    name: FreeBSD ${{ matrix.release }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        with:
          release: ${{ matrix.release }}
          usesh: true
          envs: TAG
          run: |
            set -e
            freebsd-version
            fetch -qo - "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-freebsd.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            man -w coxswain
            test -x /usr/local/etc/rc.d/coxswain_index

  other-unix:
    name: ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: NetBSD 10.1, sys: netbsd }
          - { name: OpenBSD 7.9, sys: openbsd }
          - { name: OmniOS r151058, sys: omnios }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        if: matrix.sys == 'netbsd'
        with:
          release: "10.1"
          usesh: true
          envs: TAG
          run: |
            set -e
            uname -a
            ftp -o - "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-unix.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            man -w coxswain
            test -x /etc/rc.d/coxswain_index
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        if: matrix.sys == 'openbsd'
        with:
          release: "7.9"
          usesh: true
          envs: TAG
          run: |
            set -e
            uname -a
            ftp -o - "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-unix.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            man -w coxswain
            test -x /etc/rc.d/coxswain_index
      - uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        if: matrix.sys == 'omnios'
        with:
          release: "r151058"
          usesh: true
          envs: TAG
          run: |
            set -e
            uname -a
            curl -fsSL "https://raw.githubusercontent.com/mwo-dk/coxswain/$TAG/install/install-unix.sh" | sh -s -- --terminal-only --yes --version "$TAG"
            test "$(/usr/local/bin/coxswain --version)" = "coxswain ${TAG#v}"
            /usr/local/bin/cox --version
            /usr/local/bin/coxswain --help >/dev/null
            test -f /usr/local/share/man/man1/coxswain.1
            test -f /var/svc/manifest/site/coxswain-index.xml
            svcs application/coxswain-index

  linux:
    name: Linux ${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runs-on: ubuntu-24.04, deb: amd64 }
          - { arch: aarch64, runs-on: ubuntu-24.04-arm, deb: arm64 }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VER: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Download
        run: |
          term="coxswain-terminal-$TAG-${{ matrix.arch }}-unknown-linux-musl.tar.gz"
          deb="Coxswain_${VER}_${{ matrix.deb }}.deb"
          for f in SHA256SUMS "$term" "$deb"; do
            curl -fsSLO "https://github.com/$REPO/releases/download/$TAG/$f"
          done
          sha256sum -c --ignore-missing SHA256SUMS | tee sums.txt
          test "$(grep -c ': OK$' sums.txt)" = 2
          echo "TERM_ARCHIVE=$term" >> "$GITHUB_ENV"
          echo "DEB=$deb" >> "$GITHUB_ENV"
      - name: The terminal app, static
        run: |
          tar xzf "$TERM_ARCHIVE"
          bin="${TERM_ARCHIVE%.tar.gz}/coxswain"
          file -b "$bin" | tee /dev/stderr | grep -q 'static'
          test "$("$bin" --version)" = "coxswain $VER"
          "${TERM_ARCHIVE%.tar.gz}/cox" --version
          "$bin" --help >/dev/null
      - name: The desktop app, from the .deb with apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "./$DEB" xvfb
          dpkg -L coxswain
          test "$(dpkg-query -W -f '${Version}' coxswain)" = "$VER"
          if ldd /usr/bin/coxswain-gui | grep 'not found'; then exit 1; fi
          # It starts and stays up, on a display of its own.
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a coxswain-gui "$RUNNER_TEMP/home" >gui.log 2>&1 &
          sleep 30
          alive=0; pgrep -x coxswain-gui >/dev/null && alive=1
          pkill -x coxswain-gui || true
          tail -20 gui.log
          [ "$alive" = 1 ] || { echo "::error::The desktop app did not stay up"; exit 1; }

  # `cargo install` in Termux (termux-docker on ARM64, as on a phone), as the Termux guide says.
  termux:
    name: Termux, cargo install
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VER: ${{ needs.resolve.outputs.version }}
    steps:
      # The release pipeline publishes to crates.io after the release: wait for it.
      - name: On crates.io
        run: |
          for i in $(seq 60); do
            curl -fsS -A "coxswain release check" "https://crates.io/api/v1/crates/coxswain/$VER" >/dev/null && exit 0
            sleep 60
          done
          echo "::error::coxswain $VER is not on crates.io"; exit 1
      - name: Install and start in Termux
        run: |
          docker run --rm -e VER termux/termux-docker:aarch64 bash -c '
            set -e
            pkg install -y rust clang binutils >/dev/null
            cargo install --locked coxswain --version "$VER"
            test "$(~/.cargo/bin/coxswain --version)" = "coxswain $VER"
            ~/.cargo/bin/coxswain --help >/dev/null
          '
