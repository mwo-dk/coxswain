name: NetBSD

# The terminal app on NetBSD, in a virtual machine: the core's and the terminal app's tests with
# pkgsrc's Rust, then the archive packed as a release packs it, installed with
# install/install-unix.sh, and the search helper's rc.d script started, checked and stopped.
# Every push to master; pull requests only for this system's code (paths below). docs/reference/netbsd.md.
on:
  workflow_call: # from release.yml, for every push to master
  pull_request:
    # Pull requests run the machine only for code with branches for this system;
    # every push to master runs it as part of the Release run (CLAUDE.md, Shipping).
    paths:
      - "crates/coxswain-core/src/lib.rs"
      - "crates/coxswain-core/src/machine.rs"
      - "crates/coxswain-core/src/kq.rs"
      - "crates/coxswain-core/src/ports.rs"
      - "crates/coxswain-core/src/bsd.rs"
      - "crates/coxswain-core/src/zfs.rs"
      - "crates/coxswain-core/src/flags.rs"
      - "crates/coxswain-core/src/service.rs"
      - "crates/coxswain-core/src/fs.rs"
      - "crates/coxswain-core/src/helper.rs"
      - "crates/coxswain-core/src/index.rs"
      - "crates/coxswain-core/src/tools.rs"
      - "crates/coxswain-core/src/update.rs"
      - "crates/coxswain-core/src/cloud.rs"
      - "crates/coxswain-core/src/setup.rs"
      - "crates/coxswain-core/src/menu.rs"
      - "crates/coxswain-core/tests/zfs.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "install/**"
      - "packaging/pack-unix.sh"
      - "packaging/netbsd/**"
      - ".github/workflows/netbsd.yml"
      - ".github/actions/apt-install/**"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Called from release.yml, the group is that
# run's own (github.* is the caller's there), so nothing cancels it.
concurrency:
  group: netbsd-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: NetBSD 10.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cargo's downloads, kept between runs: the VM's CARGO_HOME is inside the checkout.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-vm
          key: netbsd-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: netbsd-cargo-

      - uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: qemu-utils qemu-system-x86 ovmf # what each pinned vmactions action's install() asks for on x86_64
          recommends: false
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          release: "10.1"
          usesh: true
          custom-shell-name: vmsh
          prepare: |
            /usr/sbin/pkg_add pkgin || true
            pkgin -y install rust pkgconf
          run: |
            set -e
            export CARGO_HOME="$PWD/.cargo-vm" CARGO_PROFILE_DEV_DEBUG=line-tables-only COXSWAIN_SLOW_CI=1
            uname -a
            rustc -V
            cargo test -p coxswain-core -p coxswain --locked
            cargo build -p coxswain --locked
            mkdir -p out && cp target/debug/coxswain out/
            # Only the cache and the program go back to the runner, not the build.
            rm -rf target

      - name: Pack the archive as a release does
        run: sh packaging/pack-unix.sh v0.0.0 x86_64-unknown-netbsd out dist packaging/netbsd/coxswain_index

      - name: Install it as a user does, and the search helper from boot
        shell: vmsh {0}
        run: |
          set -e
          sh install/install-unix.sh --from dist --yes --prefix /usr/local
          /usr/local/bin/coxswain --version
          /usr/local/bin/cox --version
          man -w coxswain
          useradd -m alice
          if /etc/rc.d/coxswain_index onestart; then echo "started without a user" >&2; exit 1; fi
          printf 'coxswain_index=YES\ncoxswain_index_user=alice\n' >> /etc/rc.conf
          /etc/rc.d/coxswain_index start
          sleep 8
          /etc/rc.d/coxswain_index status
          test -s ~alice/.cache/coxswain/index.addr
          /etc/rc.d/coxswain_index stop
          sleep 3
          if pgrep -U alice coxswain; then echo "still running" >&2; exit 1; fi
          sh install/install-unix.sh --uninstall --yes --prefix /usr/local
          test ! -e /usr/local/bin/coxswain && test ! -e /etc/rc.d/coxswain_index
