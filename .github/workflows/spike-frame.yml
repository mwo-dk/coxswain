# Plugin spike (#1024), parts 2 and 3: the sealed plugin frame in each system's web view.
# On the spike/plugins branch only, never on master.
name: Plugin spike frame
on:
  push:
    branches: [spike/plugins]
    paths: [spike/frame-app/**, .github/workflows/spike-frame.yml]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  frame:
    name: frame ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries for the web view
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test data (lichess 2013-01, CC0)
        run: |
          python3 -m pip install --quiet zstandard || python3 -m pip install --quiet --break-system-packages zstandard
          curl -sSfL -o lichess.pgn.zst https://database.lichess.org/standard/lichess_db_standard_rated_2013-01.pgn.zst
          python3 spike/bench/data.py lichess.pgn.zst data
      - name: Build
        working-directory: spike/frame-app
        run: cargo build --release
      - name: Self-test
        timeout-minutes: 10
        working-directory: spike/frame-app
        env:
          SPIKE_FRAME_SELFTEST: "1"
          SPIKE_WASM: ../plugin.wasm
          SPIKE_PGN: ../../data/full.pgn
        run: |
          exe=target/release/spike-frame
          [ -f "$exe.exe" ] && exe=$exe.exe
          home=$(mktemp -d)
          export HOME=$home XDG_CONFIG_HOME=$home/.config XDG_CACHE_HOME=$home/.cache XDG_DATA_HOME=$home/.local/share
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1280x1024x24 &
            xvfb=$!
            rc=0
            DISPLAY=:99 WEBKIT_DISABLE_DMABUF_RENDERER=1 timeout 180 "$exe" > frame.json 2> frame.err || rc=$?
            kill "$xvfb" || true
            echo "exit status $rc"
            tail -n 60 frame.err
          else
            # The app ends itself after 120 s at most (and the step's own limit stands behind it).
            "$exe" > frame.json
          fi
          cat frame.json
          python3 -c "import json,sys; r=json.load(open('frame.json')); sys.exit('error' in r)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frame-${{ matrix.os }}
          path: |
            spike/frame-app/frame.json
            spike/frame-app/frame.err
