[workspace]
resolver = "3"
members = ["crates/coxswain-core", "crates/coxswain", "gui/src-tauri"]

[workspace.package]
version = "1.22.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mwo-dk/coxswain"
homepage = "https://github.com/mwo-dk/coxswain"
readme = "README.md"
keywords = ["file-manager", "norton-commander", "tui", "search", "git"]
categories = ["command-line-utilities", "filesystem"]

# `version` must admit the workspace version, for crates.io.
[workspace.dependencies]
coxswain-core = { path = "crates/coxswain-core", version = "1" }

[profile.release]
lto = "thin"
codegen-units = 1
