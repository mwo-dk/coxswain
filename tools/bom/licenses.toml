# Licence policy beyond deny.toml (tools/bom/README.md).
#
# Rust crates: deny.toml's [licenses] allow list, checked by `cargo deny` in CI.
# npm packages that ship in the desktop app: the same list plus `also_allow`, checked by
# `bom.py licenses` against their SBOM.

[npm]
# Weak copyleft, file by file. Allowed for packages used unmodified, whose source stays where it
# is published: the obligations are the notice and pointing to that source, which
# THIRD-PARTY-NOTICES.md does.
also_allow = [
  "EPL-2.0", # elkjs, mermaid's graph layout: https://github.com/kieler/elkjs
]

# Packages whose package.json does not say their licence correctly. Each was read in its
# package's licence file. Keyed by name and version: a new version is checked anew.
[npm.overrides]
"duck@0.1.12" = "BSD-2-Clause" # package.json says "BSD"; LICENSE has the two-clause text
"khroma@2.1.0" = "MIT"         # package.json has no licence; its `license` file is MIT

# Components that come with Coxswain without a package manager listing them, and C code that a
# crate compiles in under a licence of its own (cargo-about reports only the crate's). `file` is
# in this repository; `crate_files` are in the named crate's package.
[[bundled]]
name = "draw.io viewer"
what = "gui/public/vendor/drawio/viewer-static.min.js, from jgraph/drawio v32.0.2, unmodified."
license = "Apache-2.0"
source = "https://github.com/jgraph/drawio"
file = "gui/public/vendor/drawio/LICENSE"

[[bundled]]
name = "Netron"
what = "gui/public/vendor/netron: Netron v9.3.2's view, graph layout (its port of dagre) and ONNX, TensorFlow Lite, Core ML and Keras readers with their operator descriptions, unmodified but for its telemetry class cut out, bundled by gui/netron/build.mjs with Coxswain's host; index.html and grapher.css are Netron's."
license = "MIT"
source = "https://github.com/lutzroeder/netron"
file = "gui/public/vendor/netron/LICENSE"

[[bundled]]
name = "chess-art, Celtic pieces"
what = "gui/public/vendor/chess-pieces/*.svg, the Celtic set of maurimo/chess-art in its white and black colours, the Inkscape metadata taken out."
license = "MIT"
source = "https://github.com/maurimo/chess-art"
file = "gui/public/vendor/chess-pieces/LICENSE"

[[bundled]]
name = "lichess chess-openings"
what = "crates/coxswain-core/src/chess/openings.tsv: the ECO codes, names and moves of lichess-org/chess-openings, the move numbers taken out."
license = "CC0-1.0"
source = "https://github.com/lichess-org/chess-openings"
file = "tools/bom/licenses/CC0-1.0.txt"

[[bundled]]
name = "Graphviz"
what = "Compiled to WebAssembly inside the npm package @viz-js/viz (itself MIT), unmodified."
license = "EPL-1.0"
source = "https://gitlab.com/graphviz/graphviz"
file = "tools/bom/licenses/EPL-1.0.txt"

[[bundled]]
name = "Oniguruma"
what = "The C regular expression library, compiled into both apps by the crate onig_sys, for tokenizers (search by meaning)."
license = "BSD-2-Clause"
source = "https://github.com/kkos/oniguruma"
crate = "onig_sys"
crate_files = ["oniguruma/COPYING"]

[[bundled]]
name = "ring's C and assembly code"
what = "Compiled into both apps by the crate ring (TLS): code of its own, from BoringSSL, once_cell and fiat-crypto."
license = "ISC AND Apache-2.0 AND (MIT OR Apache-2.0)"
source = "https://github.com/briansmith/ring"
crate = "ring"
crate_files = ["LICENSE", "LICENSE-other-bits", "LICENSE-BoringSSL", "third_party/fiat/LICENSE"]

[[bundled]]
name = "Syntax definitions of the terminal app's viewer"
what = "About 200 Sublime Text grammars (bat's, curated by two-face), compiled into the terminal app by the crate two-face 0.5.2+bat-0.26.1 and read by syntect. Each keeps its own licence (MIT, Apache-2.0, BSD and others), listed in two-face's acknowledgements below. Update tools/bom/licenses/two-face-syntaxes.md with the two-face version."
license = "MIT OR Apache-2.0 (two-face); the grammars' own licences, listed"
source = "https://codeberg.org/CosmicHarper/two-face/src/tag/v0.5.2+bat-0.26.1/generated/acknowledgements_full.md"
file = "tools/bom/licenses/two-face-syntaxes.md"
crate = "two-face"
crate_files = ["LICENSE-MIT", "LICENSE-APACHE"]

[[bundled]]
name = "syntect"
what = "The terminal app's highlighting engine, which reads the grammars above (crate syntect)."
license = "MIT"
source = "https://github.com/trishume/syntect"
crate = "syntect"
crate_files = ["LICENSE.txt"]

[[bundled]]
name = "SQLite"
what = "Compiled into both apps by the Rust crate libsqlite3-sys (feature \"bundled\")."
license = "public domain"
source = "https://sqlite.org/copyright.html"
