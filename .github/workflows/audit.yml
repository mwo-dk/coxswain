name: Dependencies

# Known vulnerabilities, licences and sources of every dependency: on each pull request, on
# master, and once a week so an advisory published after the last change is still noticed.
on:
  push:
    branches: [master]
  pull_request:
    # Only when a dependency can have changed; master and the Monday run check the rest.
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "gui/package.json"
      - "gui/package-lock.json"
      - "tools/bom/**"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories licenses bans sources

  # The release's SBOMs, CBOM and notices (tools/bom/README.md), made on every change so that a
  # new crypto dependency, moved code or a licence outside the list fails here, not at release.
  bom:
    name: bills of materials
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: boms
          save-if: ${{ github.ref == 'refs/heads/master' }} # as in ci.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gui
      - run: cargo install --locked cargo-cyclonedx@0.5.7 cargo-about@0.8.4
      - run: tools/bom/generate.sh

  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # npm audit has no allow list: fail on any high or critical advisory except the accepted ones.
      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, no fixed version yet): build tools only (vite,
      # svelte-check), nothing of it ships. Drop it once picomatch has a fix.
      - run: |
          npm audit --json | node -e '
            const accepted = ["GHSA-fc5q-39xc-vjpf"];
            const report = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = [];
            for (const v of Object.values(report.vulnerabilities ?? {}))
              for (const via of v.via)
                if (typeof via === "object" && ["high", "critical"].includes(via.severity)
                    && !accepted.some((id) => via.url.endsWith(id)))
                  bad.push(v.name + ": " + via.title + " " + via.url);
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '
        working-directory: gui
