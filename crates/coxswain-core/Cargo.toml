[package]
name = "coxswain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core of Coxswain: config, file operations, git status and an Everything-style file name index"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25.15"
dirs = "7"
rayon = "1"
memchr = "2"
notify = "8"
regex = "1"
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
tar = "0.4.46"
flate2 = "1.1.10"
blake3 = "1.8.7"
sys-locale = "0.3.2"
# Zip entries carry local time without a zone: the system's zone turns it into a moment and back.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
quick-xml = "0.42.0"
mail-parser = "0.11.9"
encoding_rs = "0.8.42"
pdf-extract = "0.12.1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
# candle-core turns on its `onig` regex backend (Oniguruma, C; it builds under musl-tools), so the
# pure-Rust `fancy-regex` backend would only be dead code next to it. 0.22 is what candle-core wants.
tokenizers = { version = "0.22", default-features = false }
sha2 = "0.11.0"
# F1 → Features: its filter ignores diacritics. Already in the tree (tokenizers, the terminal app).
unicode-normalization = "0.1.25"
# Provenance: DSSE payloads and signatures are base64.
base64 = "0.23"
# Provenance: who signed, from a Sigstore certificate. Parsing only: its `verify` feature stays off.
x509-parser = "0.18.1"
# The helper's token, from the system's random source.
getrandom = "0.4"
# More archive formats, all pure Rust: bzip2 (its default backend), xz, zstd, 7z with AES.
bzip2 = "0.6.1"
lzma-rust2 = "0.21.0"
ruzstd = "0.9.0"
sevenz-rust2 = { version = "0.23.0", features = ["aes256"] }
# F3 on a Parquet file in the terminal app: its columns and first rows. Pure Rust codecs only
# (snappy, gzip, lz4, brotli); a zstd file shows its columns and row count.
parquet = { version = "60", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "brotli"] }

# statfs(2) for the ZFS dataset a folder is on, and chflags(2) for file flags.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android (Termux) has no desktop trash, and on illumos the trash crate cannot find the mount
# points: xdg_trash.rs is Coxswain's own.
[target.'cfg(not(any(target_os = "android", target_os = "illumos", target_os = "solaris")))'.dependencies]
trash = "5.2.9"

# Folders watched with kqueue on the BSDs (`kq`); notify depends on it there already.
[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
kqueue = "1.2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Search by meaning on Apple's GPU: the built-in model tries Metal first on a Mac (it falls back to
# the CPU when Metal is missing or disagrees). Only on macOS: other builds and the musl terminal
# build are unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
candle-transformers = { version = "0.11.0", features = ["metal"] }
